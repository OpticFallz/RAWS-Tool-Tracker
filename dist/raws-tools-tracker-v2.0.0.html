<style>
/* =============================================================================
   RAWS Tools Tracker — design system (v2.0)
   Dark ops-dashboard theme. All colors / spacing flow from these variables.
   ============================================================================= */
:root {
  --bg:            #0b1220;
  --bg-soft:       #0f172a;
  --surface:       #131f38;
  --surface-2:     #1a2947;
  --surface-3:     #22345a;
  --border:        #2a3b5e;
  --border-soft:   #1e2c4d;
  --text:          #e9effc;
  --text-soft:     #c3cfe8;
  --muted:         #8fa0c2;
  --faint:         #5b6b8c;
  --accent:        #f97316;
  --accent-hover:  #ea6a0a;
  --accent-soft:   rgba(249, 115, 22, 0.14);
  --green:         #22c55e;
  --green-soft:    rgba(34, 197, 94, 0.13);
  --red:           #ef4444;
  --red-soft:      rgba(239, 68, 68, 0.13);
  --amber:         #f59e0b;
  --amber-soft:    rgba(245, 158, 11, 0.13);
  --blue:          #38bdf8;
  --blue-soft:     rgba(56, 189, 248, 0.13);
  --radius:        10px;
  --radius-sm:     6px;
  --shadow:        0 8px 24px rgba(0, 0, 0, 0.35);
  --font:          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

::placeholder { color: var(--faint); opacity: 1; }

/* ── Animations ─────────────────────────────────────────────────────────── */
@keyframes diagPulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.diag-pulse { animation: diagPulse 1.4s ease-in-out infinite; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-up { animation: fadeUp .25s ease-out; }

/* ── Page / layout ──────────────────────────────────────────────────────── */
.page { min-height: 100vh; background: var(--bg); }
.page-body { padding: 20px; max-width: 1400px; margin: 0 auto; }

/* ── Header ─────────────────────────────────────────────────────────────── */
.app-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(15, 23, 42, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-soft);
  padding: 14px 20px;
}
.app-header-inner { max-width: 1400px; margin: 0 auto; }
.app-header-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.app-brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.app-brand-mark {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), #c2410c);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
}
.app-brand-mark svg { width: 22px; height: 22px; stroke: #fff; }
.app-brand h1 { margin: 0; font-size: 20px; letter-spacing: 0.01em; color: #fff; }
.app-brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.user-chip {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: 999px; padding: 6px 12px 6px 6px; font-size: 13px; color: var(--text-soft);
}
.user-chip .avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, var(--surface-3), var(--surface-2));
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--text);
}
.role-badge {
  font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
  padding: 3px 8px; border-radius: 999px;
}
.role-badge.admin { background: var(--green-soft); color: #6ee7b7; border: 1px solid rgba(34,197,94,.35); }
.role-badge.user  { background: var(--blue-soft);  color: #93c5fd; border: 1px solid rgba(56,189,248,.35); }
.app-header-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ── Buttons ────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text);
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: transform .08s ease, background .15s ease, border-color .15s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-3); border-color: var(--faint); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { background: #b91c1c; border-color: #b91c1c; color: #fff; }
.btn-danger:hover { background: #991b1b; }
.btn-success { background: #15803d; border-color: #15803d; color: #fff; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-block { width: 100%; justify-content: center; }
.btn .count-bubble {
  background: rgba(0,0,0,.35); border-radius: 999px;
  font-size: 11px; font-weight: 800; padding: 1px 8px;
}
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border-soft);
  color: var(--text-soft); cursor: pointer;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn svg { width: 15px; height: 15px; }

/* ── Forms ──────────────────────────────────────────────────────────────── */
.input, .select, .textarea {
  background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text);
  padding: 10px 12px; font-size: 14px; font-family: var(--font);
}
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.select option { background: var(--surface); }
.field-label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; }

/* ── Cards ──────────────────────────────────────────────────────────────── */
.card {
  background: linear-gradient(180deg, var(--surface) 0%, #101b33 100%);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color .15s ease, transform .12s ease, box-shadow .15s ease;
}
.card:hover { border-color: var(--border); box-shadow: var(--shadow); transform: translateY(-2px); }
.card-photo { width: 100%; height: 170px; object-fit: cover; background: var(--bg-soft); display: block; }
.card-photo-fallback {
  width: 100%; height: 170px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--surface-2), var(--bg-soft)); color: var(--faint);
}
.card-photo-fallback svg { width: 44px; height: 44px; }
.card-body { padding: 14px 16px 16px; }
.card-title { margin: 0 0 4px; font-size: 16px; color: #fff; font-weight: 700; }
.card-sub { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
.card-meta { display: flex; flex-direction: column; gap: 4px; margin: 10px 0 4px; font-size: 13px; color: var(--text-soft); }
.card-meta .row { display: flex; align-items: center; gap: 7px; }
.card-meta svg { width: 14px; height: 14px; color: var(--faint); flex-shrink: 0; }
.card-actions { display: flex; gap: 8px; margin-top: 12px; }
.card-actions .btn { flex: 1; justify-content: center; }

/* ── Status badges ──────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.03em;
  padding: 4px 11px; border-radius: 999px; border: 1px solid transparent;
  white-space: nowrap;
}
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge-available   { background: var(--green-soft); color: #6ee7b7; border-color: rgba(34,197,94,.35); }
.badge-checked-out { background: var(--amber-soft); color: #fcd34d; border-color: rgba(245,158,11,.35); }
.badge-missing     { background: var(--red-soft);   color: #fca5a5; border-color: rgba(239,68,68,.4); }
.badge-damaged     { background: rgba(249,115,22,.13); color: #fdba74; border-color: rgba(249,115,22,.4); }

/* ── Stats dashboard ────────────────────────────────────────────────────── */
.stat-grid {
  display: grid; gap: 12px; margin-bottom: 20px;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}
.stat-card {
  background: linear-gradient(180deg, var(--surface) 0%, #101b33 100%);
  border: 1px solid var(--border-soft); border-radius: var(--radius);
  padding: 14px 16px; display: flex; align-items: center; gap: 12px;
}
.stat-card .stat-ic {
  width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.stat-card .stat-ic svg { width: 19px; height: 19px; }
.stat-card .stat-num { font-size: 24px; font-weight: 800; color: #fff; line-height: 1; }
.stat-card .stat-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 3px; }

/* ── Toolbar ────────────────────────────────────────────────────────────── */
.toolbar {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  margin-bottom: 18px;
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius); padding: 12px;
}
.toolbar .input { flex: 1; min-width: 180px; }

/* ── Tool grid ──────────────────────────────────────────────────────────── */
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }

/* ── Modals ─────────────────────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(4, 8, 18, 0.72); backdrop-filter: blur(3px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto;
}
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow);
  width: 100%; max-width: 520px; padding: 24px;
}
.modal.wide { max-width: 720px; }
.modal h2, .modal h3 { margin: 0 0 4px; color: #fff; }
.modal .modal-sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions .btn { flex: 1; justify-content: center; }

/* ── Empty state ────────────────────────────────────────────────────────── */
.empty-state {
  text-align: center; padding: 60px 20px;
  border: 1px dashed var(--border); border-radius: var(--radius);
  background: var(--surface);
}
.empty-state svg { width: 46px; height: 46px; color: var(--faint); margin-bottom: 12px; }
.empty-state h3 { margin: 0 0 6px; color: var(--text); }
.empty-state p { margin: 0; color: var(--muted); font-size: 14px; }

/* ── Login ──────────────────────────────────────────────────────────────── */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(600px 300px at 50% -80px, rgba(249,115,22,0.12), transparent),
    var(--bg);
}
.login-wrap .app-brand-mark { width: 56px; height: 56px; margin: 0 auto 16px; }
.login-wrap .app-brand-mark svg { width: 30px; height: 30px; }
.login-card {
  width: 100%; max-width: 400px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 16px;
  padding: 36px 32px; box-shadow: var(--shadow); text-align: center;
}
.login-card h1 { margin: 0 0 6px; font-size: 22px; color: #fff; }
.login-card .login-sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
.login-card .input { width: 100%; margin-bottom: 12px; text-align: left; }

/* ── Footer ─────────────────────────────────────────────────────────────── */
.app-footer {
  max-width: 1400px; margin: 28px auto 0; padding: 18px 20px 26px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 12px; color: var(--faint);
}
.app-footer-dot { opacity: 0.5; }
.app-footer-muted { opacity: 0.75; }

/* ── QR modal ───────────────────────────────────────────────────────────── */
.qr-frame {
  background: #fff; border-radius: 12px; padding: 16px;
  display: inline-block; box-shadow: var(--shadow);
}
.qr-frame img { display: block; width: 240px; height: 240px; }

/* ── Dropdown menu ──────────────────────────────────────────────────────── */
.menu-dropdown {
  position: absolute; right: 0; margin-top: 6px; z-index: 10;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); overflow: hidden; min-width: 180px;
  box-shadow: var(--shadow);
}
.menu-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 10px 14px; background: transparent;
  border: none; color: var(--text); font-size: 13px; font-weight: 600;
  text-align: left; cursor: pointer;
}
.menu-item:hover { background: var(--surface-3); }
.menu-item svg { width: 15px; height: 15px; flex-shrink: 0; }
.menu-item.danger { color: #fca5a5; }
.menu-item.accent { color: var(--blue); }
.menu-item.good { color: #6ee7b7; }
.menu-item.warn { color: #fcd34d; }

/* ── Small screens ──────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  .page-body { padding: 14px; }
  .app-header { padding: 12px 14px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .modal { padding: 20px 16px; }
}

/* ---------- AFI compliance checks panel ---------- */
.check-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.check-panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
}
.check-panel-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
}
.check-panel-sub { font-size: 12px; color: var(--muted); }
.check-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.check-card {
  border: 1px solid var(--border);
  border-left: 4px solid var(--muted);
  border-radius: 10px;
  padding: 12px;
  background: rgba(15, 23, 42, 0.6);
}
.check-card.check-good { border-left-color: var(--green); }
.check-card.check-due { border-left-color: var(--amber); }
.check-card.check-overdue { border-left-color: var(--red); }
.check-card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.check-ic {
  width: 34px; height: 34px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent); flex-shrink: 0;
}
.check-card.check-good .check-ic { background: var(--green-soft); color: var(--green); }
.check-card.check-due .check-ic { background: var(--amber-soft); color: var(--amber); }
.check-card.check-overdue .check-ic { background: var(--red-soft); color: var(--red); }
.check-title { font-size: 14px; font-weight: 700; color: #fff; }
.check-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.check-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  padding: 4px 10px; border-radius: 999px; white-space: nowrap;
}
.check-pill .dot { width: 8px; height: 8px; border-radius: 50%; }
.check-pill.check-good { background: var(--green-soft); color: var(--green); }
.check-pill.check-good .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
.check-pill.check-due { background: var(--amber-soft); color: var(--amber); }
.check-pill.check-due .dot { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.check-pill.check-overdue { background: var(--red-soft); color: var(--red); }
.check-pill.check-overdue .dot { background: var(--red); box-shadow: 0 0 6px var(--red); }
.check-meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; display: grid; gap: 3px; }
.check-meta b { color: #e2e8f0; font-weight: 600; }
.check-due { font-weight: 700; }
.check-card.check-good .check-due { color: var(--green); }
.check-card.check-due .check-due { color: var(--amber); }
.check-card.check-overdue .check-due { color: var(--red); }
.check-actions { display: flex; gap: 8px; }
.check-history { margin-top: 10px; border-top: 1px solid var(--border-soft); padding-top: 8px; display: grid; gap: 8px; max-height: 220px; overflow-y: auto; }
.check-history-row { font-size: 12px; color: var(--muted); }
.check-history-row b { color: #e2e8f0; }
.check-history-date { color: #64748b; font-size: 11px; margin-left: 6px; }
.check-history-notes { color: #cbd5e1; font-style: italic; margin-top: 2px; }

/* ---------- QR label picker ---------- */
.qr-pick-list {
  display: grid; gap: 6px;
  max-height: 320px; overflow-y: auto;
  border: 1px solid var(--border-soft); border-radius: 8px; padding: 8px;
  background: rgba(15, 23, 42, 0.6);
}
.qr-pick-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 6px; cursor: pointer;
  font-size: 13px; color: #e2e8f0;
}
.qr-pick-row:hover { background: rgba(56, 189, 248, 0.08); }
.qr-pick-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
.qr-pick-name { font-weight: 600; }
.qr-pick-sub { color: var(--muted); font-size: 11px; margin-left: auto; }

/* ---------- Printable QR label sheet (print only) ---------- */
.qr-print-sheet { display: none; }
@media print {
  @page { margin: 0.3in; }
  .page { display: none !important; }
  .qr-print-sheet {
    display: grid !important;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.18in;
  }
  .qr-label {
    width: 1.65in; height: 1.95in;
    border: 1px dashed #888;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    page-break-inside: avoid; break-inside: avoid;
    padding: 0.08in;
    box-sizing: border-box;
  }
  .qr-label img { width: 1.05in; height: 1.05in; }
  .qr-label-name {
    margin-top: 0.06in;
    font-family: Arial, sans-serif;
    font-size: 8.5pt; font-weight: bold; color: #000;
    text-align: center; line-height: 1.15;
    max-height: 0.55in; overflow: hidden;
  }
}

@media (max-width: 900px) {
  .check-grid { grid-template-columns: 1fr; }
}

/* ---------- Bulk edit mode ---------- */
.bulk-edit-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--accent);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 16px;
}
.bulk-edit-count {
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
}
.bulk-edit-count b { color: #fff; font-size: 15px; }
.bulk-edit-field {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.card-select-check {
  width: 22px;
  height: 22px;
  accent-color: var(--accent);
  cursor: pointer;
  background: rgba(15, 23, 42, 0.85);
  border-radius: 4px;
}

/* Disabled buttons should look disabled */
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

</style>

<script>
// =============================================================================

const SHOP_CONFIG = {

    authDomain: "PASTE_YOUR_AUTH_DOMAIN_HERE",

    projectId: "PASTE_YOUR_PROJECT_ID_HERE",
    storageBucket: "PASTE_YOUR_STORAGE_BUCKET_HERE",
    messagingSenderId: "PASTE_YOUR_SENDER_ID_HERE",
    appId: "PASTE_YOUR_APP_ID_HERE"
