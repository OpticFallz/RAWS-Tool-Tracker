<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAWS Tools Tracker</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useRef, useEffect} = React;

// Firebase Configuration - YOU NEED TO REPLACE THIS
  const firebaseConfig = {
    apiKey: "AIzaSyCaWp7eMxsBN--ruRoRUZsrtYI9vspPDhw",
    authDomain: "raws-tool-tracker.firebaseapp.com",
    databaseURL: "https://raws-tool-tracker-default-rtdb.firebaseio.com",
    projectId: "raws-tool-tracker",
    storageBucket: "raws-tool-tracker.firebasestorage.app",
    messagingSenderId: "165597406752",
    appId: "1:165597406752:web:6ea2b825ab9f07895f7e45",
    measurementId: "G-ZB100K429L"
  };

// Initialize Firebase
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const database = firebase.database();
const auth = firebase.auth();

// User roles configuration
const USER_ROLES = {
  ADMIN: 'admin',
  USER: 'user'
};

// Define which users have admin access (full permissions)
const ADMIN_EMAILS = [
  'dustin.butler.6@us.af.mil',
  'conner.schlegel@us.af.mil',
  'dane.dodd@us.af.mil'
];

// Helper function to check if user is admin
const isAdminUser = (email) => {
  return ADMIN_EMAILS.includes(email.toLowerCase());
};

function App() {
  const [user, setUser] = useState(null);
  const [tools, setTools] = useState([]);
  const [login, setLogin] = useState({email: '', password: ''});
  const [authReady, setAuthReady] = useState(false);
  const [loginError, setLoginError] = useState('');
  const [showAddModal, setShowAddModal] = useState(false);
  const [newTool, setNewTool] = useState({name: '', category: 'Power Tools', image: null});
  const [showEditModal, setShowEditModal] = useState(false);
  const [editingTool, setEditingTool] = useState(null);
  const [openMenuId, setOpenMenuId] = useState(null);
  const [searchTerm, setSearchTerm] = useState('');
  const [filterCategory, setFilterCategory] = useState('all');
  const [filterStatus, setFilterStatus] = useState('all');
  const [showCamera, setShowCamera] = useState(false);
  const [stream, setStream] = useState(null);
  const [cameraMode, setCameraMode] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showMissingModal, setShowMissingModal] = useState(false);
  const [showDamagedModal, setShowDamagedModal] = useState(false);
  const [showFoundModal, setShowFoundModal] = useState(false);
  const [showRepairedModal, setShowRepairedModal] = useState(false);
  const [selectedTool, setSelectedTool] = useState(null);
  const [statusChangeData, setStatusChangeData] = useState({notes: '', location: '', condition: ''});

  const fileInputRef = useRef(null);
  const videoRef = useRef(null);

  // Firebase auth state listener
  useEffect(() => {
    const unsubscribe = auth.onAuthStateChanged((firebaseUser) => {
      if (firebaseUser) {
        const userRole = isAdminUser(firebaseUser.email) ? USER_ROLES.ADMIN : USER_ROLES.USER;
        setUser({
          name: firebaseUser.email,
          uid: firebaseUser.uid,
          email: firebaseUser.email,
          role: userRole,
          isAdmin: userRole === USER_ROLES.ADMIN
        });
      } else {
        setUser(null);
      }
      setAuthReady(true);
    });

    return () => unsubscribe();
  }, []);

  // Load tools from Firebase
  useEffect(() => {
    const toolsRef = database.ref('tools');
    toolsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        const toolsArray = Object.keys(data).map(key => ({
          id: key,
          ...data[key]
        }));
        setTools(toolsArray);
      } else {
        setTools([]);
      }
      setLoading(false);
    });

    return () => toolsRef.off();
  }, []);

  const addToolToFirebase = (tool) => {
    const newToolRef = database.ref('tools').push();
    newToolRef.set({
      ...tool,
      id: newToolRef.key
    });
  };

  const updateToolInFirebase = (toolId, updatedData) => {
    database.ref(`tools/${toolId}`).update(updatedData);
  };

  const deleteToolFromFirebase = (toolId) => {
    database.ref(`tools/${toolId}`).remove();
  };

  const updateToolStatus = (tool, newStatus, details = {}) => {
    const statusLog = {
      timestamp: new Date().toISOString(),
      dateString: new Date().toLocaleString(),
      admin: user.name,
      fromStatus: tool.status,
      toStatus: newStatus,
      ...details
    };

    const updatedTool = {
      ...tool,
      status: newStatus,
      statusLogs: [...(tool.statusLogs || []), statusLog]
    };

    // If marking as available from missing/damaged, clear holder
    if (newStatus === 'available') {
      updatedTool.holder = null;
    }

    updateToolInFirebase(tool.id, updatedTool);
  };

  const handleLogin = async () => {
    setLoginError('');
    if (!login.email || !login.password) {
      setLoginError('Please enter email and password');
      return;
    }
    try {
      await auth.signInWithEmailAndPassword(login.email, login.password);
      setLogin({email: '', password: ''});
    } catch (error) {
      let errorMessage = 'Failed to sign in';
      if (error.code === 'auth/user-not-found') {
        errorMessage = 'No user found with this email';
      } else if (error.code === 'auth/wrong-password') {
        errorMessage = 'Incorrect password';
      } else if (error.code === 'auth/invalid-email') {
        errorMessage = 'Invalid email address';
      } else if (error.code === 'auth/too-many-requests') {
        errorMessage = 'Too many failed attempts. Try again later';
      }
      setLoginError(errorMessage);
    }
  };

  const handleLogout = async () => {
    try {
      await auth.signOut();
    } catch (error) {
      console.error('Logout error:', error);
    }
  };

  const startCamera = async (mode) => {
    try {
      const mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      if (videoRef.current) {
        videoRef.current.srcObject = mediaStream;
      }
      setStream(mediaStream);
      setShowCamera(true);
      setCameraMode(mode);
    } catch (err) {
      alert('Camera access denied or unavailable');
    }
  };

  const capturePhoto = () => {
    const video = videoRef.current;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const imageData = canvas.toDataURL('image/jpeg', 0.7);
    
    if (cameraMode === 'edit') {
      setEditingTool({...editingTool, image: imageData});
    } else {
      setNewTool({...newTool, image: imageData});
    }
    stopCamera();
  };

  const stopCamera = () => {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      setStream(null);
    }
    setShowCamera(false);
    setCameraMode(null);
  };

  const handleImageUpload = (e, mode) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onloadend = () => {
        if (mode === 'edit') {
          setEditingTool({...editingTool, image: reader.result});
        } else {
          setNewTool({...newTool, image: reader.result});
        }
      };
      reader.readAsDataURL(file);
    }
  };

  if (!authReady) {
    return (
      <div style={{minHeight: '100vh', background: '#0f172a', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
        <p style={{color: 'white', fontSize: '20px'}}>Loading...</p>
      </div>
    );
  }

  if (!user) {
    return (
      <div style={{minHeight: '100vh', background: '#0f172a', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px'}}>
        <div style={{background: '#1e293b', padding: '40px', borderRadius: '10px', maxWidth: '400px', width: '100%'}}>
          <h1 style={{color: '#f97316', fontSize: '32px', textAlign: 'center', marginBottom: '20px'}}>RAWS Tools Tracker</h1>
          {loginError && (
            <div style={{background: '#7f1d1d', border: '1px solid #991b1b', color: '#fecaca', padding: '10px', borderRadius: '5px', marginBottom: '15px', fontSize: '14px'}}>
              {loginError}
            </div>
          )}
          <input
            type="email"
            placeholder="Email"
            value={login.email}
            onChange={(e) => setLogin({...login, email: e.target.value})}
            onKeyPress={(e) => {
              if (e.key === 'Enter') {
                handleLogin();
              }
            }}
            style={{width: '100%', padding: '10px', marginBottom: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
          />
          <input
            type="password"
            placeholder="Password"
            value={login.password}
            onChange={(e) => setLogin({...login, password: e.target.value})}
            onKeyPress={(e) => {
              if (e.key === 'Enter') {
                handleLogin();
              }
            }}
            style={{width: '100%', padding: '10px', marginBottom: '20px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
          />
          <button
            onClick={handleLogin}
            style={{width: '100%', padding: '12px', background: '#f97316', color: 'white', border: 'none', borderRadius: '5px', fontSize: '16px', cursor: 'pointer'}}
          >
            Sign In
          </button>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div style={{minHeight: '100vh', background: '#0f172a', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
        <p style={{color: 'white', fontSize: '20px'}}>Loading tools...</p>
      </div>
    );
  }

  const filteredTools = tools.filter(t => {
    const matchesSearch = t.name.toLowerCase().includes(searchTerm.toLowerCase());
    const matchesCategory = filterCategory === 'all' || t.category === filterCategory;
    const matchesStatus = filterStatus === 'all' || t.status === filterStatus;
    return matchesSearch && matchesCategory && matchesStatus;
  });
  
  return (
    <div style={{minHeight: '100vh', background: '#0f172a'}}>
      <div style={{background: '#1e293b', padding: '20px', borderBottom: '1px solid #334155'}}>
        <h1 style={{color: 'white', fontSize: '24px'}}>RAWS Tools Tracker</h1>
        <p style={{color: '#94a3b8', fontSize: '14px'}}>
          Welcome, {user.name}
          <span style={{marginLeft: '10px', padding: '4px 8px', background: user.isAdmin ? '#065f46' : '#1e40af', color: user.isAdmin ? '#6ee7b7' : '#93c5fd', borderRadius: '12px', fontSize: '12px', fontWeight: 'bold'}}>
            {user.isAdmin ? 'ADMIN' : 'USER'}
          </span>
        </p>
        <button onClick={handleLogout} style={{marginTop: '10px', padding: '8px 16px', background: '#334155', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}>
          Logout
        </button>
      </div>
      <div style={{padding: '20px'}}>
        <div style={{marginBottom: '20px', display: 'flex', gap: '10px', flexWrap: 'wrap', alignItems: 'center'}}>
          <input 
            type="text"
            placeholder="Search tools..."
            value={searchTerm}
            onChange={(e) => setSearchTerm(e.target.value)}
            style={{flex: '1', minWidth: '200px', padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
          />
          <select 
            value={filterCategory}
            onChange={(e) => setFilterCategory(e.target.value)}
            style={{padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
          >
            <option value="all">All Categories</option>
            <option value="Power Tools">Power Tools</option>
            <option value="Hand Tools">Hand Tools</option>
            <option value="Measuring Tools">Measuring Tools</option>
            <option value="Safety Equipment">Safety Equipment</option>
            <option value="Other">Other</option>
          </select>
          <select
            value={filterStatus}
            onChange={(e) => setFilterStatus(e.target.value)}
            style={{padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
          >
            <option value="all">All Status</option>
            <option value="available">Available</option>
            <option value="checked-out">Checked Out</option>
            <option value="missing">Missing</option>
            <option value="damaged">Damaged</option>
          </select>
          {user.isAdmin && (
            <button onClick={() => setShowAddModal(true)} style={{padding: '10px 20px', background: '#f97316', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}>
              Add Tool
            </button>
          )}
        </div>

        <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: '20px'}}>
          {filteredTools.map(tool => (
            <div key={tool.id} style={{background: '#1e293b', padding: '20px', borderRadius: '10px', border: '1px solid #334155', position: 'relative'}}>
              {user.isAdmin && (
                <div style={{position: 'absolute', top: '10px', right: '10px'}}>
                  <button onClick={() => setOpenMenuId(openMenuId === tool.id ? null : tool.id)} style={{background: '#334155', border: 'none', borderRadius: '5px', padding: '5px 10px', color: 'white', cursor: 'pointer'}}>
                    ⋮
                  </button>
                  {openMenuId === tool.id && (
                    <div style={{position: 'absolute', right: 0, marginTop: '5px', background: '#334155', borderRadius: '5px', border: '1px solid #475569', overflow: 'hidden', minWidth: '160px', zIndex: 10}}>
                      <button onClick={() => {
                        setEditingTool(tool);
                        setShowEditModal(true);
                        setOpenMenuId(null);
                      }} style={{width: '100%', padding: '10px', background: 'transparent', border: 'none', color: 'white', textAlign: 'left', cursor: 'pointer'}}>
                        ✏️ Edit
                      </button>
                      {tool.status === 'missing' ? (
                        <button onClick={() => {
                          setSelectedTool(tool);
                          setShowFoundModal(true);
                          setOpenMenuId(null);
                        }} style={{width: '100%', padding: '10px', background: 'transparent', border: 'none', color: '#10b981', textAlign: 'left', cursor: 'pointer'}}>
                          ✓ Mark as Found
                        </button>
                      ) : tool.status === 'damaged' ? (
                        <button onClick={() => {
                          setSelectedTool(tool);
                          setShowRepairedModal(true);
                          setOpenMenuId(null);
                        }} style={{width: '100%', padding: '10px', background: 'transparent', border: 'none', color: '#10b981', textAlign: 'left', cursor: 'pointer'}}>
                          🔧 Mark as Repaired
                        </button>
                      ) : (
                        <>
                          <button onClick={() => {
                            setSelectedTool(tool);
                            setShowMissingModal(true);
                            setOpenMenuId(null);
                          }} style={{width: '100%', padding: '10px', background: 'transparent', border: 'none', color: '#f59e0b', textAlign: 'left', cursor: 'pointer'}}>
                            ⚠️ Mark as Missing
                          </button>
                          <button onClick={() => {
                            setSelectedTool(tool);
                            setShowDamagedModal(true);
                            setOpenMenuId(null);
                          }} style={{width: '100%', padding: '10px', background: 'transparent', border: 'none', color: '#ef4444', textAlign: 'left', cursor: 'pointer'}}>
                            🔧 Mark as Damaged
                          </button>
                        </>
                      )}
                      <button onClick={() => {
                        if (window.confirm('Delete this tool?')) {
                          deleteToolFromFirebase(tool.id);
                        }
                        setOpenMenuId(null);
                      }} style={{width: '100%', padding: '10px', background: 'transparent', border: 'none', color: '#ef4444', textAlign: 'left', cursor: 'pointer'}}>
                        🗑️ Delete
                      </button>
                    </div>
                  )}
                </div>
              )}
              {tool.image && (
                <div style={{width: '100%', height: '200px', marginBottom: '15px', borderRadius: '8px', overflow: 'hidden', background: '#0f172a'}}>
                  <img src={tool.image} alt={tool.name} style={{width: '100%', height: '100%', objectFit: 'cover'}} />
                </div>
              )}
              <h3 style={{color: 'white', fontSize: '18px', marginBottom: '10px', paddingRight: '40px'}}>{tool.name}</h3>
              <p style={{color: '#94a3b8', fontSize: '14px', marginBottom: '10px'}}>{tool.category}</p>
              <div style={{
                display: 'inline-block',
                padding: '5px 15px',
                background: tool.status === 'available' ? '#065f46' :
                           tool.status === 'checked-out' ? '#9a3412' :
                           tool.status === 'missing' ? '#7c2d12' :
                           tool.status === 'damaged' ? '#991b1b' : '#334155',
                color: tool.status === 'available' ? '#6ee7b7' :
                       tool.status === 'checked-out' ? '#fdba74' :
                       tool.status === 'missing' ? '#fef3c7' :
                       tool.status === 'damaged' ? '#fecaca' : '#cbd5e1',
                borderRadius: '20px',
                fontSize: '14px'
              }}>
                {tool.status === 'available' ? '✓ Available' :
                 tool.status === 'checked-out' ? '📤 Checked Out' :
                 tool.status === 'missing' ? '⚠️ Missing' :
                 tool.status === 'damaged' ? '🔧 Damaged' : tool.status}
              </div>
              {(tool.status === 'available' || tool.status === 'checked-out') && (
                <button onClick={() => {
                  const updatedTool = {...tool};
                  if (tool.status === 'available') {
                    updatedTool.status = 'checked-out';
                    updatedTool.holder = user.name;
                    updatedTool.history = [...(tool.history || []), {action: 'checked-out', user: user.name, time: new Date().toLocaleString()}];
                  } else {
                    updatedTool.status = 'available';
                    updatedTool.holder = null;
                    updatedTool.history = [...(tool.history || []), {action: 'checked-in', user: user.name, time: new Date().toLocaleString()}];
                  }
                  updateToolInFirebase(tool.id, updatedTool);
                }} style={{width: '100%', marginTop: '15px', padding: '10px', background: tool.status === 'available' ? '#f97316' : '#16a34a', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}>
                  {tool.status === 'available' ? 'Check Out' : 'Check In'}
                </button>
              )}
              {tool.holder && (
                <p style={{color: '#94a3b8', fontSize: '14px', marginTop: '10px'}}>
                  👤 Checked out by: {tool.holder}
                </p>
              )}
              {((tool.history && tool.history.length > 0) || (tool.statusLogs && tool.statusLogs.length > 0)) && (
                <details style={{marginTop: '10px'}}>
                  <summary style={{color: '#94a3b8', fontSize: '14px', cursor: 'pointer'}}>
                    📋 History ({(tool.history?.length || 0) + (tool.statusLogs?.length || 0)})
                  </summary>
                  <div style={{marginTop: '5px', maxHeight: '200px', overflowY: 'auto'}}>
                    {/* Status Logs */}
                    {tool.statusLogs && tool.statusLogs.slice(-20).reverse().map((log, i) => (
                      <div key={`status-${i}`} style={{padding: '8px', background: '#0f172a', borderRadius: '3px', marginBottom: '5px', fontSize: '12px', color: '#cbd5e1', border: '1px solid #1e293b'}}>
                        <div style={{fontWeight: 'bold', marginBottom: '4px'}}>
                          <span style={{
                            color: log.toStatus === 'missing' ? '#fef3c7' :
                                   log.toStatus === 'damaged' ? '#fecaca' :
                                   log.toStatus === 'available' ? '#6ee7b7' : '#cbd5e1'
                          }}>
                            {log.toStatus === 'missing' ? '⚠️ Marked Missing' :
                             log.toStatus === 'damaged' ? '🔧 Marked Damaged' :
                             log.toStatus === 'available' && log.fromStatus === 'missing' ? '✓ Found' :
                             log.toStatus === 'available' && log.fromStatus === 'damaged' ? '✓ Repaired' : 'Status Changed'}
                          </span>
                        </div>
                        <div style={{color: '#94a3b8', fontSize: '11px', marginBottom: '2px'}}>
                          By {log.admin} - {log.dateString}
                        </div>
                        {log.notes && (
                          <div style={{color: '#cbd5e1', fontSize: '11px', marginTop: '4px', fontStyle: 'italic'}}>
                            📝 {log.notes}
                          </div>
                        )}
                        {log.location && (
                          <div style={{color: '#cbd5e1', fontSize: '11px', marginTop: '2px'}}>
                            📍 Found at: {log.location}
                          </div>
                        )}
                        {log.condition && (
                          <div style={{color: '#cbd5e1', fontSize: '11px', marginTop: '2px'}}>
                            🔍 Condition: {log.condition}
                          </div>
                        )}
                        {log.repairDetails && (
                          <div style={{color: '#cbd5e1', fontSize: '11px', marginTop: '2px'}}>
                            🔧 Repair: {log.repairDetails}
                          </div>
                        )}
                      </div>
                    ))}
                    {/* Check in/out History */}
                    {tool.history && tool.history.slice(-10).reverse().map((h, i) => (
                      <div key={`history-${i}`} style={{padding: '5px', background: '#0f172a', borderRadius: '3px', marginBottom: '3px', fontSize: '12px', color: '#cbd5e1'}}>
                        <span style={{color: h.action === 'checked-out' ? '#fdba74' : '#6ee7b7'}}>
                          {h.action === 'checked-out' ? '📤' : '📥'} {h.action}
                        </span> by {h.user} - {h.time}
                      </div>
                    ))}
                  </div>
                </details>
              )}
            </div>
          ))}
        </div>
        {filteredTools.length === 0 && (
          <p style={{color: '#94a3b8', textAlign: 'center', marginTop: '40px'}}>No tools found!</p>
        )}
      </div>
      
      {showAddModal && (
        <div style={{position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px', zIndex: 1000}}>
          <div style={{background: '#1e293b', padding: '30px', borderRadius: '10px', maxWidth: '500px', width: '100%', border: '1px solid #334155', maxHeight: '90vh', overflowY: 'auto'}}>
            <h2 style={{color: 'white', fontSize: '24px', marginBottom: '20px'}}>Add New Tool</h2>
            <div style={{marginBottom: '15px'}}>
              <label style={{color: '#cbd5e1', fontSize: '14px', display: 'block', marginBottom: '5px'}}>Tool Name</label>
              <input 
                type="text" 
                value={newTool.name}
                onChange={(e) => setNewTool({...newTool, name: e.target.value})}
                style={{width: '100%', padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
                placeholder="Enter tool name"
              />
            </div>
            <div style={{marginBottom: '15px'}}>
              <label style={{color: '#cbd5e1', fontSize: '14px', display: 'block', marginBottom: '5px'}}>Category</label>
              <select 
                value={newTool.category}
                onChange={(e) => setNewTool({...newTool, category: e.target.value})}
                style={{width: '100%', padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
              >
                <option value="Power Tools">Power Tools</option>
                <option value="Hand Tools">Hand Tools</option>
                <option value="Measuring Tools">Measuring Tools</option>
                <option value="Safety Equipment">Safety Equipment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div style={{marginBottom: '20px'}}>
              <label style={{color: '#cbd5e1', fontSize: '14px', display: 'block', marginBottom: '5px'}}>Tool Image</label>
              {newTool.image && (
                <div style={{width: '100%', height: '200px', marginBottom: '10px', borderRadius: '8px', overflow: 'hidden', background: '#0f172a'}}>
                  <img src={newTool.image} alt="Preview" style={{width: '100%', height: '100%', objectFit: 'cover'}} />
                </div>
              )}
              <div style={{display: 'flex', gap: '10px'}}>
                <button 
                  onClick={() => startCamera('add')}
                  style={{flex: 1, padding: '10px', background: '#334155', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
                >
                  📷 Camera
                </button>
                <button 
                  onClick={() => fileInputRef.current?.click()}
                  style={{flex: 1, padding: '10px', background: '#334155', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
                >
                  📁 Upload
                </button>
                <input 
                  ref={fileInputRef}
                  type="file"
                  accept="image/*"
                  onChange={(e) => handleImageUpload(e, 'add')}
                  style={{display: 'none'}}
                />
              </div>
            </div>
            <div style={{display: 'flex', gap: '10px'}}>
              <button 
                onClick={() => {
                  setShowAddModal(false);
                  setNewTool({name: '', category: 'Power Tools', image: null});
                }}
                style={{flex: 1, padding: '10px', background: '#334155', color: '#cbd5e1', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
              >
                Cancel
              </button>
              <button 
                onClick={() => {
                  if (newTool.name.trim()) {
                    addToolToFirebase({
                      name: newTool.name,
                      category: newTool.category,
                      image: newTool.image,
                      status: 'available',
                      holder: null,
                      history: []
                    });
                    setNewTool({name: '', category: 'Power Tools', image: null});
                    setShowAddModal(false);
                  }
                }}
                style={{flex: 1, padding: '10px', background: '#f97316', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
              >
                Add Tool
              </button>
            </div>
          </div>
        </div>
      )}
      
      {showEditModal && editingTool && (
        <div style={{position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px', zIndex: 1000}}>
          <div style={{background: '#1e293b', padding: '30px', borderRadius: '10px', maxWidth: '500px', width: '100%', border: '1px solid #334155', maxHeight: '90vh', overflowY: 'auto'}}>
            <h2 style={{color: 'white', fontSize: '24px', marginBottom: '20px'}}>Edit Tool</h2>
            <div style={{marginBottom: '15px'}}>
              <label style={{color: '#cbd5e1', fontSize: '14px', display: 'block', marginBottom: '5px'}}>Tool Name</label>
              <input 
                type="text" 
                value={editingTool.name}
                onChange={(e) => setEditingTool({...editingTool, name: e.target.value})}
                style={{width: '100%', padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
              />
            </div>
            <div style={{marginBottom: '15px'}}>
              <label style={{color: '#cbd5e1', fontSize: '14px', display: 'block', marginBottom: '5px'}}>Category</label>
              <select 
                value={editingTool.category}
                onChange={(e) => setEditingTool({...editingTool, category: e.target.value})}
                style={{width: '100%', padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
              >
                <option value="Power Tools">Power Tools</option>
                <option value="Hand Tools">Hand Tools</option>
                <option value="Measuring Tools">Measuring Tools</option>
                <option value="Safety Equipment">Safety Equipment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div style={{marginBottom: '20px'}}>
              <label style={{color: '#cbd5e1', fontSize: '14px', display: 'block', marginBottom: '5px'}}>Tool Image</label>
              {editingTool.image && (
                <div style={{width: '100%', height: '200px', marginBottom: '10px', borderRadius: '8px', overflow: 'hidden', background: '#0f172a'}}>
                  <img src={editingTool.image} alt="Preview" style={{width: '100%', height: '100%', objectFit: 'cover'}} />
                </div>
              )}
              <div style={{display: 'flex', gap: '10px'}}>
                <button 
                  onClick={() => startCamera('edit')}
                  style={{flex: 1, padding: '10px', background: '#334155', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
                >
                  📷 Camera
                </button>
                <button 
                  onClick={() => fileInputRef.current?.click()}
                  style={{flex: 1, padding: '10px', background: '#334155', color: 'white', border: '1px solid #475569', borderRadius: '5px', cursor: 'pointer'}}
                >
                  📁 Upload
                </button>
                <input 
                  ref={fileInputRef}
                  type="file"
                  accept="image/*"
                  onChange={(e) => handleImageUpload(e, 'edit')}
                  style={{display: 'none'}}
                />
              </div>
            </div>
            <div style={{display: 'flex', gap: '10px'}}>
              <button 
                onClick={() => {
                  setShowEditModal(false);
                  setEditingTool(null);
                }}
                style={{flex: 1, padding: '10px', background: '#334155', color: '#cbd5e1', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
              >
                Cancel
              </button>
              <button 
                onClick={() => {
                  if (editingTool.name.trim()) {
                    updateToolInFirebase(editingTool.id, editingTool);
                    setShowEditModal(false);
                    setEditingTool(null);
                  }
                }}
                style={{flex: 1, padding: '10px', background: '#f97316', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
              >
                Save Changes
              </button>
            </div>
          </div>
        </div>
      )}

      {showCamera && (
        <div style={{position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.95)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '20px', zIndex: 2000}}>
          <video
            ref={videoRef}
            autoPlay
            playsInline
            style={{width: '100%', maxWidth: '600px', borderRadius: '10px', marginBottom: '20px'}}
          />
          <div style={{display: 'flex', gap: '10px'}}>
            <button
              onClick={stopCamera}
              style={{padding: '15px 30px', background: '#334155', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer', fontSize: '16px'}}
            >
              Cancel
            </button>
            <button
              onClick={capturePhoto}
              style={{padding: '15px 30px', background: '#f97316', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer', fontSize: '16px'}}
            >
              📸 Capture
            </button>
          </div>
        </div>
      )}

      {/* Mark as Missing Modal */}
      {showMissingModal && selectedTool && (
        <div style={{position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px', zIndex: 1000}}>
          <div style={{background: '#1e293b', padding: '30px', borderRadius: '10px', maxWidth: '500px', width: '100%', border: '1px solid #334155'}}>
            <h2 style={{color: 'white', fontSize: '24px', marginBottom: '20px'}}>⚠️ Mark as Missing</h2>
            <p style={{color: '#cbd5e1', fontSize: '14px', marginBottom: '15px'}}>
              Tool: <strong>{selectedTool.name}</strong>
            </p>
            <div style={{marginBottom: '20px'}}>
              <label style={{color: '#cbd5e1', fontSize: '14px', display: 'block', marginBottom: '5px'}}>
                Notes (Optional)
              </label>
              <textarea
                value={statusChangeData.notes}
                onChange={(e) => setStatusChangeData({...statusChangeData, notes: e.target.value})}
                placeholder="Add any notes about when/where it was last seen..."
                style={{width: '100%', padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white', minHeight: '100px', resize: 'vertical'}}
              />
            </div>
            <div style={{display: 'flex', gap: '10px'}}>
              <button
                onClick={() => {
                  setShowMissingModal(false);
                  setSelectedTool(null);
                  setStatusChangeData({notes: '', location: '', condition: ''});
                }}
                style={{flex: 1, padding: '10px', background: '#334155', color: '#cbd5e1', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
              >
                Cancel
              </button>
              <button
                onClick={() => {
                  updateToolStatus(selectedTool, 'missing', {
                    notes: statusChangeData.notes
                  });
                  setShowMissingModal(false);
                  setSelectedTool(null);
                  setStatusChangeData({notes: '', location: '', condition: ''});
                }}
                style={{flex: 1, padding: '10px', background: '#f59e0b', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
              >
                Mark as Missing
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Mark as Damaged Modal */}
      {showDamagedModal && selectedTool && (
        <div style={{position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px', zIndex: 1000}}>
          <div style={{background: '#1e293b', padding: '30px', borderRadius: '10px', maxWidth: '500px', width: '100%', border: '1px solid #334155'}}>
            <h2 style={{color: 'white', fontSize: '24px', marginBottom: '20px'}}>🔧 Mark as Damaged</h2>
            <p style={{color: '#cbd5e1', fontSize: '14px', marginBottom: '15px'}}>
              Tool: <strong>{selectedTool.name}</strong>
            </p>
            <div style={{marginBottom: '20px'}}>
              <label style={{color: '#cbd5e1', fontSize: '14px', display: 'block', marginBottom: '5px'}}>
                Damage Description
              </label>
              <textarea
                value={statusChangeData.notes}
                onChange={(e) => setStatusChangeData({...statusChangeData, notes: e.target.value})}
                placeholder="Describe the damage..."
                style={{width: '100%', padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white', minHeight: '100px', resize: 'vertical'}}
              />
            </div>
            <div style={{display: 'flex', gap: '10px'}}>
              <button
                onClick={() => {
                  setShowDamagedModal(false);
                  setSelectedTool(null);
                  setStatusChangeData({notes: '', location: '', condition: ''});
                }}
                style={{flex: 1, padding: '10px', background: '#334155', color: '#cbd5e1', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
              >
                Cancel
              </button>
              <button
                onClick={() => {
                  updateToolStatus(selectedTool, 'damaged', {
                    notes: statusChangeData.notes
                  });
                  setShowDamagedModal(false);
                  setSelectedTool(null);
                  setStatusChangeData({notes: '', location: '', condition: ''});
                }}
                style={{flex: 1, padding: '10px', background: '#ef4444', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
              >
                Mark as Damaged
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Mark as Found Modal */}
      {showFoundModal && selectedTool && (
        <div style={{position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px', zIndex: 1000}}>
          <div style={{background: '#1e293b', padding: '30px', borderRadius: '10px', maxWidth: '500px', width: '100%', border: '1px solid #334155', maxHeight: '90vh', overflowY: 'auto'}}>
            <h2 style={{color: 'white', fontSize: '24px', marginBottom: '20px'}}>✓ Mark as Found</h2>
            <p style={{color: '#cbd5e1', fontSize: '14px', marginBottom: '15px'}}>
              Tool: <strong>{selectedTool.name}</strong>
            </p>
            <div style={{marginBottom: '15px'}}>
              <label style={{color: '#cbd5e1', fontSize: '14px', display: 'block', marginBottom: '5px'}}>
                Where was it found? <span style={{color: '#ef4444'}}>*</span>
              </label>
              <input
                type="text"
                value={statusChangeData.location}
                onChange={(e) => setStatusChangeData({...statusChangeData, location: e.target.value})}
                placeholder="e.g., Storage room B, under workbench..."
                style={{width: '100%', padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
              />
            </div>
            <div style={{marginBottom: '15px'}}>
              <label style={{color: '#cbd5e1', fontSize: '14px', display: 'block', marginBottom: '5px'}}>
                Condition when found <span style={{color: '#ef4444'}}>*</span>
              </label>
              <input
                type="text"
                value={statusChangeData.condition}
                onChange={(e) => setStatusChangeData({...statusChangeData, condition: e.target.value})}
                placeholder="e.g., Good condition, slightly dirty, missing parts..."
                style={{width: '100%', padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
              />
            </div>
            <div style={{marginBottom: '20px'}}>
              <label style={{color: '#cbd5e1', fontSize: '14px', display: 'block', marginBottom: '5px'}}>
                Additional Notes (Optional)
              </label>
              <textarea
                value={statusChangeData.notes}
                onChange={(e) => setStatusChangeData({...statusChangeData, notes: e.target.value})}
                placeholder="Any additional details..."
                style={{width: '100%', padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white', minHeight: '80px', resize: 'vertical'}}
              />
            </div>
            <div style={{display: 'flex', gap: '10px'}}>
              <button
                onClick={() => {
                  setShowFoundModal(false);
                  setSelectedTool(null);
                  setStatusChangeData({notes: '', location: '', condition: ''});
                }}
                style={{flex: 1, padding: '10px', background: '#334155', color: '#cbd5e1', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
              >
                Cancel
              </button>
              <button
                onClick={() => {
                  if (!statusChangeData.location.trim() || !statusChangeData.condition.trim()) {
                    alert('Please fill in where it was found and its condition');
                    return;
                  }
                  updateToolStatus(selectedTool, 'available', {
                    location: statusChangeData.location,
                    condition: statusChangeData.condition,
                    notes: statusChangeData.notes
                  });
                  setShowFoundModal(false);
                  setSelectedTool(null);
                  setStatusChangeData({notes: '', location: '', condition: ''});
                }}
                style={{flex: 1, padding: '10px', background: '#10b981', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
              >
                Mark as Found
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Mark as Repaired Modal */}
      {showRepairedModal && selectedTool && (
        <div style={{position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px', zIndex: 1000}}>
          <div style={{background: '#1e293b', padding: '30px', borderRadius: '10px', maxWidth: '500px', width: '100%', border: '1px solid #334155'}}>
            <h2 style={{color: 'white', fontSize: '24px', marginBottom: '20px'}}>✓ Mark as Repaired</h2>
            <p style={{color: '#cbd5e1', fontSize: '14px', marginBottom: '15px'}}>
              Tool: <strong>{selectedTool.name}</strong>
            </p>
            <div style={{marginBottom: '20px'}}>
              <label style={{color: '#cbd5e1', fontSize: '14px', display: 'block', marginBottom: '5px'}}>
                Repair Details <span style={{color: '#ef4444'}}>*</span>
              </label>
              <textarea
                value={statusChangeData.notes}
                onChange={(e) => setStatusChangeData({...statusChangeData, notes: e.target.value})}
                placeholder="Describe what was repaired/fixed..."
                style={{width: '100%', padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white', minHeight: '100px', resize: 'vertical'}}
              />
            </div>
            <div style={{display: 'flex', gap: '10px'}}>
              <button
                onClick={() => {
                  setShowRepairedModal(false);
                  setSelectedTool(null);
                  setStatusChangeData({notes: '', location: '', condition: ''});
                }}
                style={{flex: 1, padding: '10px', background: '#334155', color: '#cbd5e1', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
              >
                Cancel
              </button>
              <button
                onClick={() => {
                  if (!statusChangeData.notes.trim()) {
                    alert('Please describe the repair work done');
                    return;
                  }
                  updateToolStatus(selectedTool, 'available', {
                    repairDetails: statusChangeData.notes,
                    notes: statusChangeData.notes
                  });
                  setShowRepairedModal(false);
                  setSelectedTool(null);
                  setStatusChangeData({notes: '', location: '', condition: ''});
                }}
                style={{flex: 1, padding: '10px', background: '#10b981', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}
              >
                Mark as Repaired
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
