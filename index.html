<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAWS Tools Tracker</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
  @keyframes diagPulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .diag-pulse { animation: diagPulse 1.4s ease-in-out infinite; }
</style>

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useRef, useEffect} = React;

// =============================================================================
// SHOP CONFIGURATION — Edit this block to deploy for a new shop/unit
// See README.md for step-by-step setup instructions
// =============================================================================
const SHOP_CONFIG = {

  // Set to false to show the setup wizard (do this first when deploying for a new shop)
  // Set to true once setup is complete to hide the wizard permanently
  setupComplete: true,

  // Display name shown throughout the app
  shopName: 'RAWS Tools Tracker',

  // Firebase project credentials — get these from your Firebase console
  // (Project Settings > Your apps > Web app > SDK setup and configuration)
  firebase: {
    apiKey: "AIzaSyCaWp7eMxsBN--ruRoRUZsrtYI9vspPDhw",
    authDomain: "raws-tool-tracker.firebaseapp.com",
    databaseURL: "https://raws-tool-tracker-default-rtdb.firebaseio.com",
    projectId: "raws-tool-tracker",
    storageBucket: "raws-tool-tracker.firebasestorage.app",
    messagingSenderId: "165597406752",
    appId: "1:165597406752:web:6ea2b825ab9f07895f7e45",
    measurementId: "G-ZB100K429L"
  },

  // Email addresses that have full admin access (add/edit/delete tools, manage logs)
  // All other authenticated users get read + checkout/return access only
  adminEmails: [
    'dustin.butler.6@us.af.mil',
    'conner.schlegel@us.af.mil',
    'dane.dodd@us.af.mil'
  ]

};
// =============================================================================
// END SHOP CONFIGURATION
// =============================================================================

// Initialize Firebase (wrapped in try-catch so the setup wizard still renders if credentials are missing/wrong)
let database, auth;
try {
  if (!firebase.apps.length) {
    firebase.initializeApp(SHOP_CONFIG.firebase);
  }
  database = firebase.database();
  auth = firebase.auth();
} catch(e) {
  console.warn('Firebase init failed — check your SHOP_CONFIG.firebase credentials:', e.message);
}

// User roles configuration
const USER_ROLES = {
  ADMIN: 'admin',
  USER: 'user'
};

// Helper function to check if user is admin
const isAdminUser = (email) => {
  return SHOP_CONFIG.adminEmails.map(e => e.toLowerCase()).includes(email.toLowerCase());
};

// =============================================================================
// DIAGNOSTICS PANEL
// Admin-only tool that checks every critical subsystem and surfaces issues
// with plain-language explanations and step-by-step recommended fixes.
// =============================================================================
function DiagnosticsPanel({onClose}) {
  const [results, setResults]   = useState([]);
  const [running, setRunning]   = useState(false);
  const [lastRun, setLastRun]   = useState(null);
  const [expandedId, setExpandedId] = useState(null);

  // Stable AbortController-based fetch with timeout (works on all modern browsers)
  const fetchWithTimeout = (url, ms = 6000) => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, {signal: ctrl.signal}).finally(() => clearTimeout(timer));
  };

  const runChecks = async () => {
    setRunning(true);
    setExpandedId(null);

    // Seed every row as "checking" immediately so the user sees progress
    const seed = [
      {id:'fb-init',      name:'Firebase Initialization',     category:'Core'},
      {id:'fb-conn',      name:'Database Connection',          category:'Core'},
      {id:'fb-auth',      name:'Authentication Service',       category:'Core'},
      {id:'db-read',      name:'Database Read Access',         category:'Database'},
      {id:'db-security',  name:'Database Security Rules',      category:'Database'},
      {id:'cfg-name',     name:'Shop Name',                    category:'Configuration'},
      {id:'cfg-firebase', name:'Firebase Credentials',         category:'Configuration'},
      {id:'cfg-admins',   name:'Admin Accounts',               category:'Configuration'},
      {id:'qr-api',       name:'QR Code Service',              category:'External Services'},
      {id:'browser-store',name:'Browser Local Storage',        category:'Browser'},
    ];
    setResults(seed.map(s => ({...s, status:'checking', message:'Running…'})));

    const out = {}; // accumulate results
    seed.forEach(s => { out[s.id] = {...s, status:'checking', message:'Running…'}; });

    const set = (id, patch) => {
      out[id] = {...out[id], ...patch};
      setResults(Object.values(out));
    };

    // ── 1. Firebase Initialization ────────────────────────────────────────────
    if (!database || !auth) {
      set('fb-init', {
        status:'error', message:'Firebase failed to initialize',
        detail:'firebase.initializeApp() threw an error. The credentials in SHOP_CONFIG.firebase are likely malformed or incomplete.',
        fix:'Verify every field in SHOP_CONFIG.firebase matches your Firebase console exactly.',
        fixSteps:[
          'Open Firebase console → Project Settings (⚙️ icon) → Your apps → Web app',
          'Copy the full firebaseConfig object',
          'Replace the firebase block in SHOP_CONFIG with that copied config',
          'Make sure databaseURL is included — it looks like: https://your-project-default-rtdb.firebaseio.com',
        ]
      });
    } else {
      set('fb-init', {status:'healthy', message:'Firebase SDK initialized successfully'});
    }

    // ── 2. Database Connection ─────────────────────────────────────────────────
    if (!database) {
      set('fb-conn', {status:'error', message:'Skipped — Firebase not initialized'});
    } else {
      try {
        const snap = await Promise.race([
          database.ref('.info/connected').once('value'),
          new Promise((_,r) => setTimeout(() => r(new Error('timeout')), 7000))
        ]);
        if (snap.val() === true) {
          set('fb-conn', {status:'healthy', message:`Connected to Firebase project: ${SHOP_CONFIG.firebase.projectId}`});
        } else {
          set('fb-conn', {
            status:'error', message:'Database is reachable but reports disconnected',
            detail:'Firebase connected to the server but the Realtime Database is reporting offline. This can happen if the database URL is wrong or the database has not been created yet.',
            fix:'Confirm your Realtime Database has been created in the Firebase console and that databaseURL in SHOP_CONFIG is correct.',
            fixSteps:[
              'Firebase console → Build → Realtime Database',
              'If you see "Create Database", click it and choose a region',
              'Copy the URL shown at the top (https://your-project-default-rtdb.firebaseio.com)',
              'Paste it as databaseURL in SHOP_CONFIG.firebase'
            ]
          });
        }
      } catch(e) {
        set('fb-conn', {
          status:'error', message:'Cannot reach Firebase database',
          detail:`Error: ${e.message}. The device may have no internet, or the databaseURL in SHOP_CONFIG is wrong.`,
          fix:'Check internet connectivity and verify databaseURL matches your Firebase project.',
          fixSteps:[
            'Confirm the device has internet access',
            'Open Firebase console → Realtime Database and copy the exact URL',
            'Update databaseURL in SHOP_CONFIG.firebase in index.html'
          ]
        });
      }
    }

    // ── 3. Authentication Service ──────────────────────────────────────────────
    if (!auth) {
      set('fb-auth', {status:'error', message:'Skipped — Firebase not initialized'});
    } else {
      try {
        // Calling fetchSignInMethodsForEmail with a dummy address will throw if
        // the auth service is unreachable or authDomain is wrong.
        await auth.fetchSignInMethodsForEmail('diag-check@example.com');
        set('fb-auth', {
          status:'healthy',
          message: auth.currentUser
            ? `Auth service running — logged in as ${auth.currentUser.email}`
            : 'Auth service is running'
        });
      } catch(e) {
        if (e.code === 'auth/network-request-failed') {
          set('fb-auth', {
            status:'error', message:'Auth service unreachable (network error)',
            detail:'Cannot reach Firebase Authentication. Check internet and verify authDomain in SHOP_CONFIG.',
            fix:'Confirm authDomain matches your Firebase project (e.g. your-project.firebaseapp.com) and that Email/Password sign-in is enabled.',
            fixSteps:[
              'Firebase console → Build → Authentication → Sign-in method',
              'Make sure Email/Password is Enabled',
              'Check authDomain in SHOP_CONFIG.firebase matches your project'
            ]
          });
        } else {
          // Other errors (e.g. invalid-email) just mean the service responded — it's working
          set('fb-auth', {status:'healthy', message:'Authentication service is responding'});
        }
      }
    }

    // ── 4. Database Read Access ────────────────────────────────────────────────
    if (!database) {
      set('db-read', {status:'error', message:'Skipped — Firebase not initialized'});
    } else {
      try {
        await database.ref('tools').limitToFirst(1).once('value');
        set('db-read', {status:'healthy', message:'Database read successful'});
      } catch(e) {
        if (e.code === 'PERMISSION_DENIED') {
          set('db-read', {
            status:'error', message:'Permission denied — cannot read database',
            detail:'Your database security rules are blocking reads. If you are logged in and still seeing this, the rules may be incorrectly configured.',
            fix:'Update your database rules to allow authenticated reads.',
            fixSteps:[
              'Firebase console → Realtime Database → Rules tab',
              'Replace the rules with: { "rules": { ".read": "auth != null", ".write": "auth != null" } }',
              'Click Publish'
            ]
          });
        } else {
          set('db-read', {
            status:'error', message:`Database read failed: ${e.message}`,
            detail:e.message,
            fix:'Check Firebase connection and database security rules.'
          });
        }
      }
    }

    // ── 5. Database Security Rules ─────────────────────────────────────────────
    if (!SHOP_CONFIG.firebase.databaseURL || SHOP_CONFIG.firebase.databaseURL.includes('undefined')) {
      set('db-security', {status:'warning', message:'Cannot check — databaseURL not set in config'});
    } else {
      try {
        const res = await fetchWithTimeout(`${SHOP_CONFIG.firebase.databaseURL}/.json?shallow=true`);
        if (res.status === 200) {
          set('db-security', {
            status:'warning', message:'Database allows unauthenticated public read access',
            detail:'Anyone who finds your database URL can read your entire tool inventory without logging in. This is a security risk.',
            fix:'Set database rules to require authentication.',
            fixSteps:[
              'Firebase console → Realtime Database → Rules tab',
              'Replace existing rules with: { "rules": { ".read": "auth != null", ".write": "auth != null" } }',
              'Click Publish',
              'Reload this page and re-run diagnostics to confirm'
            ]
          });
        } else if (res.status === 401 || res.status === 403) {
          set('db-security', {status:'healthy', message:'Database requires authentication — public access is blocked'});
        } else {
          set('db-security', {status:'warning', message:`Unexpected response from database (HTTP ${res.status})`, detail:'Could not definitively verify security rules.'});
        }
      } catch(e) {
        set('db-security', {
          status:'warning', message:'Could not verify security rules',
          detail:`Network error while testing anonymous access: ${e.message}. Rules may be fine — this check requires internet access.`
        });
      }
    }

    // ── 6. Config: Shop Name ───────────────────────────────────────────────────
    if (SHOP_CONFIG.shopName !== 'RAWS Tools Tracker') {
      set('cfg-name', {status:'healthy', message:`Shop name is set to "${SHOP_CONFIG.shopName}"`});
    } else {
      set('cfg-name', {
        status:'warning', message:'Still using the default template shop name',
        detail:'shopName in SHOP_CONFIG has not been changed from "RAWS Tools Tracker". If this is the RAWS shop you can ignore this.',
        fix:'Change shopName in SHOP_CONFIG to your unit\'s name, e.g. "14 MXS Tools Tracker".'
      });
    }

    // ── 7. Config: Firebase Credentials ───────────────────────────────────────
    if (SHOP_CONFIG.firebase.projectId !== 'raws-tool-tracker') {
      set('cfg-firebase', {status:'healthy', message:`Using custom Firebase project: ${SHOP_CONFIG.firebase.projectId}`});
    } else {
      set('cfg-firebase', {
        status:'warning', message:'Using the template Firebase project credentials',
        detail:'This instance is pointed at the original RAWS Firebase project. If you are the RAWS shop, this is fine. All other shops must create and use their own Firebase project.',
        fix:'Create your own Firebase project and replace the firebase block in SHOP_CONFIG.'
      });
    }

    // ── 8. Config: Admin Accounts ──────────────────────────────────────────────
    const DEFAULT_ADMINS = ['dustin.butler.6@us.af.mil','conner.schlegel@us.af.mil','dane.dodd@us.af.mil'];
    const leftoverDefaults = SHOP_CONFIG.adminEmails.filter(e => DEFAULT_ADMINS.includes(e.toLowerCase()));
    if (SHOP_CONFIG.adminEmails.length === 0) {
      set('cfg-admins', {
        status:'error', message:'No admin accounts configured — nobody can manage tools',
        fix:'Add at least one .mil email address to adminEmails in SHOP_CONFIG, then redeploy.'
      });
    } else if (leftoverDefaults.length > 0) {
      set('cfg-admins', {
        status:'warning', message:`Admin list still contains ${leftoverDefaults.length} template address${leftoverDefaults.length>1?'es':''}`,
        detail:`Template address${leftoverDefaults.length>1?'es':''}  still present: ${leftoverDefaults.join(', ')}. These people may have unintended admin access to your shop.`,
        fix:'Replace the default emails with your shop personnel in SHOP_CONFIG.adminEmails and redeploy.'
      });
    } else {
      set('cfg-admins', {status:'healthy', message:`${SHOP_CONFIG.adminEmails.length} admin account${SHOP_CONFIG.adminEmails.length!==1?'s':''} configured`});
    }

    // ── 9. QR Code Service ─────────────────────────────────────────────────────
    try {
      const res = await fetchWithTimeout('https://api.qrserver.com/v1/create-qr-code/?size=1x1&data=test');
      if (res.ok) {
        set('qr-api', {status:'healthy', message:'QR code service (api.qrserver.com) is reachable'});
      } else {
        set('qr-api', {
          status:'warning', message:`QR service returned HTTP ${res.status}`,
          detail:'QR codes may not generate correctly right now.',
          fix:'This is an external free API. Check https://api.qrserver.com in a browser. If it is down, wait and try again later.'
        });
      }
    } catch(e) {
      set('qr-api', {
        status:'error', message:'Cannot reach QR code service',
        detail:'api.qrserver.com is unreachable. QR codes will not load until connectivity is restored.',
        fix:'Check internet connectivity. If the device has internet but this still fails, the QR service may be temporarily down.',
        fixSteps:[
          'Confirm general internet access (try loading another website)',
          'Try opening https://api.qrserver.com directly in a browser tab',
          'If the service is down, wait and re-run diagnostics later'
        ]
      });
    }

    // ── 10. Browser Local Storage ──────────────────────────────────────────────
    try {
      localStorage.setItem('__diag__','1');
      localStorage.removeItem('__diag__');
      set('browser-store', {status:'healthy', message:'Browser local storage is available'});
    } catch(e) {
      set('browser-store', {
        status:'warning', message:'Browser local storage is unavailable',
        detail:'Setup wizard progress and in-browser preferences will not persist between sessions. This usually happens in private/incognito mode or when storage is full.',
        fix:'Enable cookies and local storage in browser settings, or switch out of private/incognito mode.'
      });
    }

    setRunning(false);
    setLastRun(new Date());
  };

  useEffect(() => { runChecks(); }, []);

  const overallStatus = results.length === 0 ? 'checking'
    : results.some(r => r.status==='error')    ? 'error'
    : results.some(r => r.status==='checking') ? 'checking'
    : results.some(r => r.status==='warning')  ? 'warning'
    : 'healthy';

  const DOT_COLORS = {healthy:'#10b981', warning:'#f59e0b', error:'#ef4444', checking:'#6366f1'};

  const Dot = ({status, size=10}) => (
    <div className={status==='checking' ? 'diag-pulse' : ''} style={{
      width:size, height:size, borderRadius:'50%', flexShrink:0,
      background: DOT_COLORS[status] || '#475569',
      boxShadow: status!=='healthy' ? `0 0 7px ${DOT_COLORS[status]}` : 'none'
    }}/>
  );

  const StatusBadge = ({status}) => {
    const labels = {healthy:'HEALTHY', warning:'WARNING', error:'ERROR', checking:'CHECKING…'};
    const bgs    = {healthy:'#065f46', warning:'#78350f', error:'#7f1d1d', checking:'#1e3a5f'};
    const fgs    = {healthy:'#6ee7b7', warning:'#fcd34d', error:'#fca5a5', checking:'#93c5fd'};
    return (
      <span style={{background:bgs[status]||'#1e293b', color:fgs[status]||'#64748b', padding:'2px 9px', borderRadius:'12px', fontSize:'11px', fontWeight:'bold', letterSpacing:'0.06em', whiteSpace:'nowrap'}}>
        {labels[status]||status}
      </span>
    );
  };

  const categories = ['Core','Database','Configuration','External Services','Browser'];

  return (
    <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.82)',display:'flex',alignItems:'center',justifyContent:'center',padding:'20px',zIndex:2000}}>
      <div style={{background:'#1e293b',borderRadius:'12px',maxWidth:'660px',width:'100%',border:'1px solid #334155',maxHeight:'90vh',display:'flex',flexDirection:'column'}}>

        {/* ── Header ── */}
        <div style={{padding:'18px 22px 14px',borderBottom:'1px solid #334155',display:'flex',alignItems:'center',gap:'12px'}}>
          <Dot status={overallStatus} size={14}/>
          <div style={{flex:1}}>
            <h2 style={{color:'white',fontSize:'18px',fontWeight:'bold',marginBottom:'2px'}}>System Diagnostics</h2>
            <p style={{color:'#475569',fontSize:'12px'}}>
              {running ? 'Running checks…'
               : lastRun ? `Last run: ${lastRun.toLocaleTimeString()} — ${results.filter(r=>r.status==='healthy').length} healthy, ${results.filter(r=>r.status==='warning').length} warning, ${results.filter(r=>r.status==='error').length} error`
               : ''}
            </p>
          </div>
          <button onClick={runChecks} disabled={running}
            style={{padding:'7px 13px',background:'#334155',color:running?'#475569':'#cbd5e1',border:'none',borderRadius:'6px',cursor:running?'default':'pointer',fontSize:'13px'}}>
            {running ? '⟳ Running…' : '⟳ Re-run All'}
          </button>
          <button onClick={onClose}
            style={{padding:'7px 13px',background:'#334155',color:'#cbd5e1',border:'none',borderRadius:'6px',cursor:'pointer',fontSize:'13px'}}>
            ✕ Close
          </button>
        </div>

        {/* ── Summary strip ── */}
        <div style={{padding:'10px 22px',borderBottom:'1px solid #334155',display:'flex',gap:'20px',flexWrap:'wrap'}}>
          {['healthy','warning','error'].map(s => {
            const n = results.filter(r=>r.status===s).length;
            const labels = {healthy:'Healthy',warning:'Warning',error:'Error'};
            return n > 0 ? (
              <div key={s} style={{display:'flex',alignItems:'center',gap:'6px'}}>
                <Dot status={s} size={8}/>
                <span style={{color:DOT_COLORS[s],fontSize:'13px',fontWeight:'bold'}}>{n}</span>
                <span style={{color:'#64748b',fontSize:'13px'}}>{labels[s]}</span>
              </div>
            ) : null;
          })}
          {running && <div style={{display:'flex',alignItems:'center',gap:'6px'}}><Dot status="checking" size={8}/><span style={{color:'#6366f1',fontSize:'13px'}}>Checking…</span></div>}
        </div>

        {/* ── Results ── */}
        <div style={{flex:1,overflowY:'auto',padding:'16px 22px'}}>
          {categories.map(cat => {
            const catResults = results.filter(r => r.category === cat);
            if (catResults.length === 0) return null;
            return (
              <div key={cat} style={{marginBottom:'18px'}}>
                <p style={{color:'#475569',fontSize:'11px',fontWeight:'bold',letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:'8px'}}>{cat}</p>
                <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
                  {catResults.map(r => {
                    const hasDetail = r.detail || r.fix || r.fixSteps;
                    const isOpen = expandedId === r.id;
                    const borderColor = r.status==='error' ? '#7f1d1d' : r.status==='warning' ? '#78350f' : '#1e293b';
                    return (
                      <div key={r.id} style={{background:'#0f172a',borderRadius:'8px',border:`1px solid ${borderColor}`,overflow:'hidden'}}>
                        {/* Row */}
                        <div onClick={() => hasDetail && setExpandedId(isOpen ? null : r.id)}
                          style={{display:'flex',alignItems:'center',gap:'11px',padding:'11px 14px',cursor:hasDetail?'pointer':'default'}}>
                          <Dot status={r.status} size={10}/>
                          <div style={{flex:1,minWidth:0}}>
                            <p style={{color:'white',fontSize:'14px',fontWeight:'bold',marginBottom:'1px'}}>{r.name}</p>
                            <p style={{color:'#64748b',fontSize:'12px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.message}</p>
                          </div>
                          <StatusBadge status={r.status}/>
                          {hasDetail && <span style={{color:'#334155',fontSize:'12px',marginLeft:'4px'}}>{isOpen?'▲':'▼'}</span>}
                        </div>
                        {/* Expanded detail */}
                        {isOpen && hasDetail && (
                          <div style={{padding:'0 14px 14px',borderTop:'1px solid #1e293b'}}>
                            {r.detail && <p style={{color:'#94a3b8',fontSize:'13px',lineHeight:1.7,marginTop:'12px'}}>{r.detail}</p>}
                            {r.fix && (
                              <div style={{background:'#1a1207',border:'1px solid #78350f',borderRadius:'7px',padding:'10px 14px',marginTop:'12px'}}>
                                <p style={{color:'#f59e0b',fontSize:'12px',fontWeight:'bold',marginBottom:'6px'}}>⚡ Recommended Fix</p>
                                <p style={{color:'#fcd34d',fontSize:'13px',lineHeight:1.6}}>{r.fix}</p>
                              </div>
                            )}
                            {r.fixSteps && r.fixSteps.length > 0 && (
                              <div style={{marginTop:'10px'}}>
                                <p style={{color:'#475569',fontSize:'11px',fontWeight:'bold',letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:'6px'}}>Step-by-Step</p>
                                <ol style={{paddingLeft:'18px',margin:0}}>
                                  {r.fixSteps.map((step,i) => (
                                    <li key={i} style={{color:'#94a3b8',fontSize:'13px',lineHeight:2.1}}>{step}</li>
                                  ))}
                                </ol>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>

      </div>
    </div>
  );
}
// =============================================================================

// =============================================================================
// SETUP WIZARD
// Shown when SHOP_CONFIG.setupComplete is false.
// Guides a new shop through every configuration step with auto-checks.
// =============================================================================
function SetupWizard({onSkip}) {
  const [fbStatus, setFbStatus] = useState('checking'); // 'checking' | 'connected' | 'disconnected'
  const [manualDone, setManualDone] = useState(() => {
    try { return JSON.parse(localStorage.getItem('raws_setup_steps') || '{}'); }
    catch { return {}; }
  });
  const [expanded, setExpanded] = useState(0);

  // Test Firebase connection
  useEffect(() => {
    if (!database) { setFbStatus('disconnected'); return; }
    const ref = database.ref('.info/connected');
    const handler = snap => setFbStatus(snap.val() === true ? 'connected' : 'disconnected');
    ref.on('value', handler);
    const timer = setTimeout(() => setFbStatus(prev => prev === 'checking' ? 'disconnected' : prev), 6000);
    return () => { ref.off('value', handler); clearTimeout(timer); };
  }, []);

  const toggleManual = (key) => {
    setManualDone(prev => {
      const next = {...prev, [key]: !prev[key]};
      localStorage.setItem('raws_setup_steps', JSON.stringify(next));
      return next;
    });
  };

  // Original template values used for auto-detection
  const ORIG = {
    projectId:    'raws-tool-tracker',
    shopName:     'RAWS Tools Tracker',
    adminEmails:  ['dustin.butler.6@us.af.mil', 'conner.schlegel@us.af.mil', 'dane.dodd@us.af.mil']
  };

  const chk = {
    firebaseChanged:    SHOP_CONFIG.firebase.projectId !== ORIG.projectId,
    shopNameChanged:    SHOP_CONFIG.shopName !== ORIG.shopName,
    adminEmailsChanged: !SHOP_CONFIG.adminEmails.some(e => ORIG.adminEmails.includes(e.toLowerCase())),
    fbConnected:        fbStatus === 'connected',
  };
  const configAllDone = chk.firebaseChanged && chk.shopNameChanged && chk.adminEmailsChanged;

  // ── Step definitions ─────────────────────────────────────────────────────
  const steps = [
    {
      title: 'Get the Files',
      autoCheck: true,
      status: 'complete',
      body: (
        <div>
          <p style={{color:'#94a3b8',fontSize:'14px',lineHeight:1.7,marginBottom:'12px'}}>

          </p>
          <div style={{background:'#0f172a',borderRadius:'6px',padding:'12px 16px'}}>
            <p style={{color:'#cbd5e1',fontSize:'13px',marginBottom:'4px'}}><strong>Recommended action:</strong></p>
            <p style={{color:'#94a3b8',fontSize:'13px',lineHeight:1.6}}>
              Go to <strong style={{color:'#f97316'}}>github.com/OpticFallz/RAWS-Tool-Tracker</strong> → click <strong>Fork</strong> → create a fork under your own GitHub account. Then clone or edit the file online.
            </p>
          </div>
        </div>
      )
    },
    {
      title: 'Create a Firebase Project',
      autoCheck: true,
      status: chk.firebaseChanged && chk.fbConnected ? 'complete'
             : chk.firebaseChanged && fbStatus === 'disconnected' ? 'error'

          </p>
          <ol style={{color:'#cbd5e1',fontSize:'14px',lineHeight:2.2,paddingLeft:'20px',marginBottom:'14px'}}>
            <li>Go to <strong style={{color:'#f97316'}}>console.firebase.google.com</strong> and sign in</li>
            <li>Click <strong>Add project</strong> → enter a name (e.g. <code style={{background:'#0f172a',padding:'2px 6px',borderRadius:'3px'}}>14mxs-tools</code>) → Continue</li>
            <li>Left sidebar → Build → <strong>Realtime Database</strong> → Create database → choose your region → Start in <em>test mode</em> (you'll lock it down in Step 4)</li>
            <li>Left sidebar → Build → <strong>Authentication</strong> → Get started → Sign-in method → Enable <strong>Email/Password</strong></li>
            <li>Click the ⚙️ gear → <strong>Project Settings</strong> → scroll to "Your apps" → click <strong>&lt;/&gt;</strong> → Register app → copy the <code>firebaseConfig</code> object — you'll need it in Step 3</li>
          </ol>
          <div style={{padding:'12px 16px',background:'#0f172a',borderRadius:'6px',fontSize:'13px',border:'1px solid #334155'}}>
            {fbStatus === 'checking'    && <span style={{color:'#93c5fd'}}>🔄 Checking Firebase connection…</span>}
            {fbStatus === 'connected'   && chk.firebaseChanged  && <span style={{color:'#6ee7b7'}}>✓ Firebase connected successfully to your project</span>}
            {fbStatus === 'connected'   && !chk.firebaseChanged && <span style={{color:'#f59e0b'}}>⚠️ Connected to the template project — you need your own Firebase project</span>}
            {fbStatus === 'disconnected'&& chk.firebaseChanged  && <span style={{color:'#fca5a5'}}>✗ Cannot connect — double-check your firebaseConfig values in SHOP_CONFIG</span>}
            {fbStatus === 'disconnected'&& !chk.firebaseChanged && <span style={{color:'#64748b'}}>○ Not yet configured</span>}
          </div>
        </div>
      )
    },
    {
      title: 'Update SHOP_CONFIG in index.html',
      autoCheck: true,
      status: configAllDone ? 'complete' : (chk.firebaseChanged || chk.shopNameChanged || chk.adminEmailsChanged) ? 'partial' : 'pending',
      body: (
        <div>
          <p style={{color:'#94a3b8',fontSize:'14px',lineHeight:1.7,marginBottom:'12px'}}>
            Open <code style={{background:'#0f172a',padding:'2px 6px',borderRadius:'3px'}}>index.html</code> in any text editor (Notepad, VS Code, etc.) and find the <code style={{background:'#0f172a',padding:'2px 6px',borderRadius:'3px'}}>SHOP_CONFIG</code> block near the top. Update all three items below:
          </p>
          <div style={{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'14px'}}>
            {[
              { key:'firebaseChanged',    label:'Firebase credentials replaced with your project config', cur: SHOP_CONFIG.firebase.projectId },
              { key:'shopNameChanged',    label:'Shop name changed from the default',                    cur: SHOP_CONFIG.shopName },
              { key:'adminEmailsChanged', label:'Admin email list updated to your personnel',           cur: SHOP_CONFIG.adminEmails.join(', ') },
            ].map(item => (
              <div key={item.key} style={{display:'flex',alignItems:'flex-start',gap:'10px',padding:'10px 14px',background:'#0f172a',borderRadius:'6px',border:`1px solid ${chk[item.key] ? '#065f46' : '#334155'}`}}>
                <span style={{fontSize:'17px',flexShrink:0,marginTop:'1px',color:chk[item.key]?'#6ee7b7':'#475569'}}>{chk[item.key]?'✓':'○'}</span>
                <div>
                  <p style={{color:chk[item.key]?'#6ee7b7':'#cbd5e1',fontSize:'13px',fontWeight:'bold',marginBottom:'3px'}}>{item.label}</p>
                  <p style={{color:'#475569',fontSize:'12px'}}>Current value: {item.cur}</p>
                </div>
              </div>
            ))}
          </div>
          <p style={{color:'#94a3b8',fontSize:'13px',padding:'10px 14px',background:'#0f172a',borderRadius:'6px'}}>
            💡 Also change <code>setupComplete: true</code> to <code style={{color:'#f97316'}}>setupComplete: false</code> before saving so this wizard stays visible while you finish setup — then flip it back to <code style={{color:'#6ee7b7'}}>true</code> in Step 7 when done.
          </p>
        </div>
      )
    },
    {
      title: 'Set Database Security Rules',
      autoCheck: false,
      manualKey: 'rules',
      status: manualDone.rules ? 'complete' : 'pending',
      body: (
        <div>
          <p style={{color:'#94a3b8',fontSize:'14px',lineHeight:1.7,marginBottom:'12px'}}>
            By default Firebase allows anyone on the internet to read and write your database. The rules below lock it so only users who are logged in can access anything.
          </p>
          <ol style={{color:'#cbd5e1',fontSize:'14px',lineHeight:2.2,paddingLeft:'20px',marginBottom:'14px'}}>
            <li>Firebase console → Realtime Database → click the <strong>Rules</strong> tab</li>

}`}</pre>

          <ol style={{color:'#cbd5e1',fontSize:'14px',lineHeight:2.2,paddingLeft:'20px',marginBottom:'14px'}}>
            <li>Firebase console → Build → <strong>Authentication</strong> → <strong>Users</strong> tab</li>
            <li>Click <strong>Add user</strong> → enter their .mil email address and a temporary password</li>
            <li>Give them the credentials — they log in at your hosted URL</li>

          <div style={{padding:'10px 14px',background:'#422006',borderRadius:'6px',border:'1px solid #78350f'}}>
            <p style={{color:'#fcd34d',fontSize:'13px'}}>⚠️ Create your own admin account <strong>before</strong> completing setup. Without it you cannot add tools once the app is live.</p>
          </div>
        </div>
      )
    },
    {
      title: 'Host the File on GitHub Pages',
      autoCheck: false,
      manualKey: 'host',
      status: manualDone.host ? 'complete' : 'pending',
      body: (
        <div>
          <p style={{color:'#94a3b8',fontSize:'14px',lineHeight:1.7,marginBottom:'12px'}}>
            The app must be served from a public HTTPS URL for QR code scanning to work from phones. GitHub Pages is free and takes about 2 minutes to set up.
          </p>
          <ol style={{color:'#cbd5e1',fontSize:'14px',lineHeight:2.2,paddingLeft:'20px',marginBottom:'12px'}}>
            <li>Push your updated <code style={{background:'#0f172a',padding:'2px 5px',borderRadius:'3px'}}>index.html</code> to your GitHub fork's <strong>main</strong> branch</li>
            <li>In GitHub: your repo → <strong>Settings</strong> → <strong>Pages</strong> (left sidebar)</li>
            <li>Under "Build and deployment", Source: <strong>Deploy from a branch</strong></li>
            <li>Branch: <strong>main</strong> / folder: <strong>/ (root)</strong> → click <strong>Save</strong></li>
            <li>Wait ~1 minute → your app will be live at <code style={{background:'#0f172a',padding:'2px 5px',borderRadius:'3px'}}>https://[username].github.io/[repo-name]/</code></li>
          </ol>
          <p style={{color:'#64748b',fontSize:'13px'}}>
            Current URL: <code style={{background:'#0f172a',padding:'2px 6px',borderRadius:'3px'}}>{window.location.href}</code>
          </p>
        </div>
      )
    },
    {
      title: 'Mark Setup Complete',
      autoCheck: false,
      status: 'pending',
      body: (
        <div>
          <p style={{color:'#94a3b8',fontSize:'14px',lineHeight:1.7,marginBottom:'12px'}}>
            Once every step above is done, hide this wizard permanently by setting the flag in SHOP_CONFIG.
          </p>
          <ol style={{color:'#cbd5e1',fontSize:'14px',lineHeight:2.2,paddingLeft:'20px',marginBottom:'14px'}}>
            <li>Open <code style={{background:'#0f172a',padding:'2px 5px',borderRadius:'3px'}}>index.html</code> in your text editor</li>
            <li>Find the line <code style={{background:'#0f172a',padding:'2px 5px',borderRadius:'3px',color:'#fca5a5'}}>setupComplete: false</code></li>
            <li>Change it to <code style={{background:'#0f172a',padding:'2px 5px',borderRadius:'3px',color:'#6ee7b7'}}>setupComplete: true</code></li>
            <li>Save and push to GitHub — the wizard will no longer appear</li>
          </ol>
          <div style={{padding:'10px 14px',background:'#0d2818',borderRadius:'6px',border:'1px solid #065f46'}}>
            <p style={{color:'#6ee7b7',fontSize:'13px'}}>✓ Your shop's tool tracker will be fully operational after this final step.</p>
          </div>
        </div>
      )
    }
  ];
  // ── End step definitions ─────────────────────────────────────────────────

  const completedCount = steps.filter(s => s.status === 'complete').length;

  const StatusBadge = ({status}) => {
    const map = {
      complete:  {bg:'#065f46', color:'#6ee7b7', label:'COMPLETE'},
      partial:   {bg:'#78350f', color:'#fcd34d', label:'IN PROGRESS'},
      error:     {bg:'#7f1d1d', color:'#fca5a5', label:'ERROR'},
      checking:  {bg:'#1e3a5f', color:'#93c5fd', label:'CHECKING…'},
      pending:   {bg:'#1e293b', color:'#475569', label:'NOT STARTED'},
    };
    const c = map[status] || map.pending;
    return (
      <span style={{background:c.bg,color:c.color,padding:'3px 9px',borderRadius:'12px',fontSize:'11px',fontWeight:'bold',letterSpacing:'0.06em',whiteSpace:'nowrap'}}>
        {c.label}
      </span>
    );
  };

  return (
    <div style={{minHeight:'100vh',background:'#0f172a',padding:'20px',overflowY:'auto'}}>
      <div style={{maxWidth:'700px',margin:'0 auto',paddingBottom:'40px'}}>

        {/* Header */}
        <div style={{textAlign:'center',paddingTop:'30px',marginBottom:'28px'}}>
          <p style={{color:'#f97316',fontSize:'13px',fontWeight:'bold',letterSpacing:'0.1em',marginBottom:'8px'}}>SHOP TOOLS TRACKER</p>
          <h1 style={{color:'white',fontSize:'26px',fontWeight:'bold',marginBottom:'6px'}}>First-Time Setup Guide</h1>
          <p style={{color:'#94a3b8',fontSize:'14px',lineHeight:1.6}}>
            Follow each step in order. Steps marked <span style={{color:'#6366f1',fontWeight:'bold'}}>🔍 auto-check</span> verify themselves — you'll see the status update automatically when you save the file and reload.
          </p>

          {/* Progress bar */}
          <div style={{marginTop:'22px',background:'#1e293b',borderRadius:'10px',padding:'16px 20px',border:'1px solid #334155'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
              <span style={{color:'#94a3b8',fontSize:'13px'}}>Overall Progress</span>
              <span style={{color:'white',fontSize:'14px',fontWeight:'bold'}}>{completedCount} of {steps.length} steps complete</span>
            </div>
            <div style={{background:'#334155',borderRadius:'4px',height:'10px',overflow:'hidden'}}>
              <div style={{
                background: completedCount === steps.length ? '#10b981' : '#f97316',
                height:'100%',
                width:`${(completedCount/steps.length)*100}%`,
                transition:'width 0.4s ease',
                borderRadius:'4px'
              }}/>
            </div>
          </div>
        </div>

        {/* Steps */}
        <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
          {steps.map((step, i) => {
            const isOpen = expanded === i;
            const borderColor = step.status === 'complete' ? '#065f46'
                              : step.status === 'error'    ? '#7f1d1d'
                              : step.status === 'partial'  ? '#78350f' : '#334155';
            return (
              <div key={i} style={{background:'#1e293b',borderRadius:'10px',border:`1px solid ${borderColor}`,overflow:'hidden'}}>
                {/* Row header */}
                <div
                  onClick={() => setExpanded(isOpen ? null : i)}
                  style={{display:'flex',alignItems:'center',gap:'12px',padding:'15px 18px',cursor:'pointer',userSelect:'none'}}
                >
                  {/* Step number circle */}
                  <div style={{
                    width:'34px',height:'34px',borderRadius:'50%',flexShrink:0,
                    background: step.status==='complete' ? '#065f46' : step.status==='error' ? '#7f1d1d' : '#334155',
                    color:       step.status==='complete' ? '#6ee7b7' : step.status==='error' ? '#fca5a5' : '#94a3b8',
                    display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize: step.status==='complete' ? '17px' : '14px',fontWeight:'bold'
                  }}>
                    {step.status === 'complete' ? '✓' : i + 1}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'}}>
                      <span style={{color:'white',fontSize:'15px',fontWeight:'bold'}}>Step {i+1} — {step.title}</span>
                      {step.autoCheck && <span style={{color:'#6366f1',fontSize:'11px',fontWeight:'bold'}}>🔍 auto-check</span>}
                    </div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:'10px',flexShrink:0}}>
                    <StatusBadge status={step.status} />
                    <span style={{color:'#475569',fontSize:'14px'}}>{isOpen ? '▲' : '▼'}</span>
                  </div>
                </div>

                {/* Expandable body */}
                {isOpen && (
                  <div style={{padding:'4px 18px 20px',borderTop:'1px solid #334155'}}>
                    <div style={{paddingTop:'16px'}}>
                      {step.body}
                      {/* Manual confirm checkbox */}
                      {step.manualKey && (
                        <div
                          onClick={() => toggleManual(step.manualKey)}
                          style={{
                            display:'flex',alignItems:'center',gap:'12px',
                            marginTop:'16px',padding:'12px 16px',
                            background: manualDone[step.manualKey] ? '#0d2818' : '#0f172a',
                            borderRadius:'8px',
                            border:`2px solid ${manualDone[step.manualKey] ? '#10b981' : '#334155'}`,
                            cursor:'pointer'
                          }}
                        >
                          <div style={{
                            width:'22px',height:'22px',borderRadius:'5px',flexShrink:0,
                            background: manualDone[step.manualKey] ? '#10b981' : 'transparent',
                            border:`2px solid ${manualDone[step.manualKey] ? '#10b981' : '#475569'}`,
                            display:'flex',alignItems:'center',justifyContent:'center'
                          }}>
                            {manualDone[step.manualKey] && <span style={{color:'white',fontSize:'14px',lineHeight:1}}>✓</span>}
                          </div>
                          <span style={{color: manualDone[step.manualKey] ? '#6ee7b7' : '#cbd5e1', fontSize:'14px',fontWeight:'bold'}}>
                            I have completed this step
                          </span>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Footer escape hatch */}
        <div style={{textAlign:'center',marginTop:'30px'}}>
          <p style={{color:'#334155',fontSize:'12px',marginBottom:'10px'}}>
            Manual step confirmations are saved in this browser. Auto-checked steps re-verify every time the page loads.
          </p>
          <button
            onClick={onSkip}
            style={{background:'none',border:'none',color:'#475569',fontSize:'12px',cursor:'pointer',textDecoration:'underline'}}
          >
            Already configured — skip wizard and go to app
          </button>
        </div>

      </div>
    </div>
  );
}
// =============================================================================

function App() {
  const [skipSetupWizard, setSkipSetupWizard] = useState(false);
  const [showDiagnosticsPanel, setShowDiagnosticsPanel] = useState(false);
  const [bgHealth, setBgHealth] = useState('unknown'); // quick background health for the header dot
  const [user, setUser] = useState(null);
  const [tools, setTools] = useState([]);
  const [login, setLogin] = useState({email: '', password: ''});
  const [authReady, setAuthReady] = useState(false);
  const [loginError, setLoginError] = useState('');
  const [showAddModal, setShowAddModal] = useState(false);
  const [newTool, setNewTool] = useState({name: '', category: 'Power Tools', location: '', locationId: '', image: null});
  const [showEditModal, setShowEditModal] = useState(false);
  const [editingTool, setEditingTool] = useState(null);
  const [openMenuId, setOpenMenuId] = useState(null);
  const [searchTerm, setSearchTerm] = useState('');
  const [filterLocation, setFilterLocation] = useState('all');
  const [filterStatus, setFilterStatus] = useState('all');
  const [showCamera, setShowCamera] = useState(false);
  const [stream, setStream] = useState(null);
  const [cameraMode, setCameraMode] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showMissingModal, setShowMissingModal] = useState(false);
  const [showDamagedModal, setShowDamagedModal] = useState(false);
  const [showFoundModal, setShowFoundModal] = useState(false);
  const [showRepairedModal, setShowRepairedModal] = useState(false);
  const [selectedTool, setSelectedTool] = useState(null);
  const [statusChangeData, setStatusChangeData] = useState({notes: '', location: '', condition: ''});
  const [showEditLogModal, setShowEditLogModal] = useState(false);
  const [editingLog, setEditingLog] = useState(null);
  const [editLogReason, setEditLogReason] = useState('');
  const [showCheckoutModal, setShowCheckoutModal] = useState(false);
  const [checkoutTool, setCheckoutTool] = useState(null);
  const [showQRModal, setShowQRModal] = useState(false);
  const [qrTool, setQrTool] = useState(null);
  const [pendingToolId, setPendingToolId] = useState(null);

  // Location-based QR state
  const [locationsList, setLocationsList] = useState([]);
  const [locationsLoaded, setLocationsLoaded] = useState(false);
  const [showLocationsManageModal, setShowLocationsManageModal] = useState(false);
  const [showAddLocationModal, setShowAddLocationModal] = useState(false);
  const [newLocation, setNewLocation] = useState({name: '', description: ''});
  const [showLocationQRModal, setShowLocationQRModal] = useState(false);
  const [locationQRTarget, setLocationQRTarget] = useState(null);
  const [pendingLocationId, setPendingLocationId] = useState(null);
  const [showLocationScanModal, setShowLocationScanModal] = useState(false);
  const [locationScanTarget, setLocationScanTarget] = useState(null);
  const [selectedToolIds, setSelectedToolIds] = useState(new Set());

  const fileInputRef = useRef(null);
  const videoRef = useRef(null);

  // Firebase auth state listener
  useEffect(() => {
    const unsubscribe = auth.onAuthStateChanged((firebaseUser) => {
      if (firebaseUser) {
        const userRole = isAdminUser(firebaseUser.email) ? USER_ROLES.ADMIN : USER_ROLES.USER;
        setUser({
          name: firebaseUser.email,
          uid: firebaseUser.uid,
          email: firebaseUser.email,
          role: userRole,
          isAdmin: userRole === USER_ROLES.ADMIN
        });
      } else {
        setUser(null);
      }
      setAuthReady(true);
    });

    return () => unsubscribe();
  }, []);

  // Load tools from Firebase
  useEffect(() => {
    const toolsRef = database.ref('tools');
    toolsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        const toolsArray = Object.keys(data).map(key => ({
          id: key,
          ...data[key]
        }));
        setTools(toolsArray);
      } else {
        setTools([]);
      }
      setLoading(false);
    });

    return () => toolsRef.off();
  }, []);

  // Load locations from Firebase
  useEffect(() => {
    const locRef = database.ref('locations');
    locRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        const arr = Object.keys(data).map(key => ({id: key, ...data[key]}));
        setLocationsList(arr.sort((a, b) => a.name.localeCompare(b.name)));
      } else {
        setLocationsList([]);
      }
      setLocationsLoaded(true);
    });
    return () => locRef.off();
  }, []);

  // Background health check — runs once on load, updates the header dot
  useEffect(() => {
    if (!database) { setBgHealth('error'); return; }
    let cancelled = false;
    const timer = setTimeout(async () => {
      try {
        const snap = await database.ref('.info/connected').once('value');
        if (!cancelled) setBgHealth(snap.val() === true ? 'healthy' : 'error');
      } catch { if (!cancelled) setBgHealth('error'); }
    }, 2000); // small delay so it doesn't race with initial load
    return () => { cancelled = true; clearTimeout(timer); };
  }, []);

  // Extract tool ID or location ID from URL on first load
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const toolId = params.get('tool');
    const locationId = params.get('location');
    if (toolId) {
      setPendingToolId(toolId);
      window.history.replaceState({}, document.title, window.location.pathname);
    } else if (locationId) {
      setPendingLocationId(locationId);
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }, []);

  // Once we have a pending tool ID, user is logged in, and tools are loaded — open checkout modal
  useEffect(() => {
    if (pendingToolId && user && tools.length > 0) {
      const tool = tools.find(t => t.id === pendingToolId);
      if (tool) {
        setCheckoutTool(tool);
        setShowCheckoutModal(true);
      }
      setPendingToolId(null);
    }
  }, [pendingToolId, user, tools]);

  // Once we have a pending location ID, user is logged in, and locations have loaded — open scan modal
  useEffect(() => {
    if (pendingLocationId && user && locationsLoaded) {
      const loc = locationsList.find(l => l.id === pendingLocationId);
      if (loc) {
        setLocationScanTarget(loc);
        setSelectedToolIds(new Set());
        setShowLocationScanModal(true);
      } else {
        alert('Location not found. It may have been deleted.');
      }
      setPendingLocationId(null);
    }
  }, [pendingLocationId, user, locationsLoaded, locationsList]);

  const addToolToFirebase = (tool) => {
    const newToolRef = database.ref('tools').push();
    newToolRef.set({
      ...tool,
      id: newToolRef.key
    });
  };

  const updateToolInFirebase = (toolId, updatedData) => {
    database.ref(`tools/${toolId}`).update(updatedData);
  };

  const deleteToolFromFirebase = (toolId) => {
    database.ref(`tools/${toolId}`).remove();
  };

  const updateToolStatus = (tool, newStatus, details = {}) => {
    const statusLog = {
      timestamp: new Date().toISOString(),
      dateString: new Date().toLocaleString(),
      admin: user.name,
      fromStatus: tool.status,
      toStatus: newStatus,
      ...details
    };

    const updatedTool = {
      ...tool,
      status: newStatus,
      statusLogs: [...(tool.statusLogs || []), statusLog]
    };

    // If marking as available from missing/damaged, clear holder
    if (newStatus === 'available') {
      updatedTool.holder = null;
    }

    updateToolInFirebase(tool.id, updatedTool);
  };

  const editLog = (tool, logType, logIndex, newData, reason) => {
    const originalLog = logType === 'status'
      ? {...tool.statusLogs[logIndex]}
      : {...tool.history[logIndex]};

    // Create edit record
    const editRecord = {
      timestamp: new Date().toISOString(),
      dateString: new Date().toLocaleString(),
      admin: user.name,
      reason: reason,
      logType: logType,
      logIndex: logIndex,
      originalData: originalLog,
      newData: newData
    };

    // Update the log
    const updatedTool = {...tool};
    if (logType === 'status') {
      const updatedStatusLogs = [...tool.statusLogs];
      updatedStatusLogs[logIndex] = {...originalLog, ...newData};
      updatedTool.statusLogs = updatedStatusLogs;
    } else {
      const updatedHistory = [...tool.history];
      updatedHistory[logIndex] = {...originalLog, ...newData};
      updatedTool.history = updatedHistory;
    }

    // Add to logEdits array
    updatedTool.logEdits = [...(tool.logEdits || []), editRecord];

    updateToolInFirebase(tool.id, updatedTool);
  };

  const deleteLog = (tool, logType, logIndex, reason) => {
    const originalLog = logType === 'status'
      ? {...tool.statusLogs[logIndex]}
      : {...tool.history[logIndex]};

    // Create edit record for deletion
    const editRecord = {
      timestamp: new Date().toISOString(),
      dateString: new Date().toLocaleString(),
      admin: user.name,
      reason: reason,
      logType: logType,
      logIndex: logIndex,
      originalData: originalLog,
      action: 'deleted'
    };

    // Remove the log
    const updatedTool = {...tool};
    if (logType === 'status') {
      const updatedStatusLogs = [...tool.statusLogs];
      updatedStatusLogs.splice(logIndex, 1);
      updatedTool.statusLogs = updatedStatusLogs;
    } else {
      const updatedHistory = [...tool.history];
      updatedHistory.splice(logIndex, 1);
      updatedTool.history = updatedHistory;
    }

    // Add to logEdits array
    updatedTool.logEdits = [...(tool.logEdits || []), editRecord];

    updateToolInFirebase(tool.id, updatedTool);
  };

  const handleLogin = async () => {
    setLoginError('');
    if (!login.email || !login.password) {
      setLoginError('Please enter email and password');
      return;
    }
    try {
      await auth.signInWithEmailAndPassword(login.email, login.password);
      setLogin({email: '', password: ''});
    } catch (error) {
      let errorMessage = 'Failed to sign in';
      if (error.code === 'auth/user-not-found') {
        errorMessage = 'No user found with this email';
      } else if (error.code === 'auth/wrong-password') {
        errorMessage = 'Incorrect password';
      } else if (error.code === 'auth/invalid-email') {
        errorMessage = 'Invalid email address';
      } else if (error.code === 'auth/too-many-requests') {
        errorMessage = 'Too many failed attempts. Try again later';
      }
      setLoginError(errorMessage);
    }
  };

  const handleLogout = async () => {
    try {
      await auth.signOut();
    } catch (error) {
      console.error('Logout error:', error);
    }
  };

  const startCamera = async (mode) => {
    try {
      const mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      if (videoRef.current) {
        videoRef.current.srcObject = mediaStream;
      }
      setStream(mediaStream);
      setShowCamera(true);
      setCameraMode(mode);
    } catch (err) {
      alert('Camera access denied or unavailable');
    }
  };

  const capturePhoto = () => {
    const video = videoRef.current;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const imageData = canvas.toDataURL('image/jpeg', 0.7);
    
    if (cameraMode === 'edit') {
      setEditingTool({...editingTool, image: imageData});
    } else {
      setNewTool({...newTool, image: imageData});
    }
    stopCamera();
  };

  const stopCamera = () => {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      setStream(null);
    }
    setShowCamera(false);
    setCameraMode(null);
  };

  const openQRModal = (tool) => {
    setQrTool(tool);
    setShowQRModal(true);
  };

  const getQRImageUrl = (tool) => {
    const baseUrl = window.location.origin + window.location.pathname;
    const toolUrl = `${baseUrl}?tool=${tool.id}`;
    return `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(toolUrl)}`;
  };

  const downloadQRCode = async (tool) => {
    try {
      const imgUrl = getQRImageUrl(tool);
      const response = await fetch(imgUrl);
      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = `QR-${tool.name.replace(/\s+/g, '-')}.png`;
      a.click();
      URL.revokeObjectURL(blobUrl);
    } catch (e) {
      alert('Download failed. Try right-clicking the QR image and saving it.');
    }
  };

  // Location Firebase functions
  const addLocationToFirebase = (location) => {
    const ref = database.ref('locations').push();
    ref.set({...location, id: ref.key});
  };

  const deleteLocationFromFirebase = (locationId) => {
    database.ref(`locations/${locationId}`).remove();
  };

  const getLocationQRImageUrl = (location) => {
    const baseUrl = window.location.origin + window.location.pathname;
    const url = `${baseUrl}?location=${location.id}`;
    return `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(url)}`;
  };

  const downloadLocationQRCode = async (location) => {
    try {
      const imgUrl = getLocationQRImageUrl(location);
      const response = await fetch(imgUrl);
      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = `QR-Location-${location.name.replace(/\s+/g, '-')}.png`;
      a.click();
      URL.revokeObjectURL(blobUrl);
    } catch (e) {
      alert('Download failed. Try right-clicking the QR image and saving it.');
    }
  };

  const handleBulkCheckout = (toolIds) => {
    const toolsToCheckout = tools.filter(t => toolIds.has(t.id) && t.status === 'available');
    toolsToCheckout.forEach(tool => {
      const updatedTool = {...tool};
      updatedTool.status = 'checked-out';
      updatedTool.holder = user.name;
      updatedTool.history = [...(tool.history || []), {action: 'checked-out', user: user.name, time: new Date().toLocaleString()}];
      updateToolInFirebase(tool.id, updatedTool);
    });
    setSelectedToolIds(new Set());
    setShowLocationScanModal(false);
  };

  const handleBulkReturn = (toolIds) => {
    const toolsToReturn = tools.filter(t =>
      toolIds.has(t.id) &&
      t.status === 'checked-out' &&
      (t.holder === user.name || user.isAdmin)
    );
    toolsToReturn.forEach(tool => {
      const updatedTool = {...tool};
      updatedTool.status = 'available';
      updatedTool.holder = null;
      updatedTool.history = [...(tool.history || []), {action: 'checked-in', user: user.name, time: new Date().toLocaleString()}];
      updateToolInFirebase(tool.id, updatedTool);
    });
    setSelectedToolIds(new Set());
    setShowLocationScanModal(false);
  };

  const handleImageUpload = (e, mode) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onloadend = () => {
        if (mode === 'edit') {
          setEditingTool({...editingTool, image: reader.result});
        } else {
          setNewTool({...newTool, image: reader.result});
        }
      };
      reader.readAsDataURL(file);
    }
  };

  // Show setup wizard when not yet configured
  if (!SHOP_CONFIG.setupComplete && !skipSetupWizard) {
    return <SetupWizard onSkip={() => setSkipSetupWizard(true)} />;
  }

  if (!authReady) {
    return (
      <div style={{minHeight: '100vh', background: '#0f172a', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
        <p style={{color: 'white', fontSize: '20px'}}>Loading...</p>
      </div>
    );
  }

  if (!user) {
    return (
      <div style={{minHeight: '100vh', background: '#0f172a', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px'}}>
        <div style={{background: '#1e293b', padding: '40px', borderRadius: '10px', maxWidth: '400px', width: '100%'}}>
          <h1 style={{color: '#f97316', fontSize: '32px', textAlign: 'center', marginBottom: '20px'}}>{SHOP_CONFIG.shopName}</h1>
          {loginError && (
            <div style={{background: '#7f1d1d', border: '1px solid #991b1b', color: '#fecaca', padding: '10px', borderRadius: '5px', marginBottom: '15px', fontSize: '14px'}}>
              {loginError}
            </div>
          )}
          <input
            type="email"
            placeholder="Email"
            value={login.email}
            onChange={(e) => setLogin({...login, email: e.target.value})}
            onKeyPress={(e) => {
              if (e.key === 'Enter') {
                handleLogin();
              }
            }}
            style={{width: '100%', padding: '10px', marginBottom: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
          />
          <input
            type="password"
            placeholder="Password"
            value={login.password}
            onChange={(e) => setLogin({...login, password: e.target.value})}
            onKeyPress={(e) => {
              if (e.key === 'Enter') {
                handleLogin();
              }
            }}
            style={{width: '100%', padding: '10px', marginBottom: '20px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
          />
          <button
            onClick={handleLogin}
            style={{width: '100%', padding: '12px', background: '#f97316', color: 'white', border: 'none', borderRadius: '5px', fontSize: '16px', cursor: 'pointer'}}
          >
            Sign In
          </button>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div style={{minHeight: '100vh', background: '#0f172a', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
        <p style={{color: 'white', fontSize: '20px'}}>Loading tools...</p>
      </div>
    );
  }

  // Get unique locations from tools
  const locations = [...new Set(tools.map(t => t.location).filter(loc => loc && loc.trim()))].sort();

  const filteredTools = tools.filter(t => {
    const matchesSearch = t.name.toLowerCase().includes(searchTerm.toLowerCase());
    const matchesLocation = filterLocation === 'all' || t.location === filterLocation;
    const matchesStatus = filterStatus === 'all' || t.status === filterStatus;
    return matchesSearch && matchesLocation && matchesStatus;
  });
  
  return (
    <div style={{minHeight: '100vh', background: '#0f172a'}}>
      <div style={{background: '#1e293b', padding: '20px', borderBottom: '1px solid #334155'}}>
        <h1 style={{color: 'white', fontSize: '24px'}}>{SHOP_CONFIG.shopName}</h1>
        <p style={{color: '#94a3b8', fontSize: '14px'}}>
          Welcome, {user.name}
          <span style={{marginLeft: '10px', padding: '4px 8px', background: user.isAdmin ? '#065f46' : '#1e40af', color: user.isAdmin ? '#6ee7b7' : '#93c5fd', borderRadius: '12px', fontSize: '12px', fontWeight: 'bold'}}>
            {user.isAdmin ? 'ADMIN' : 'USER'}
          </span>
        </p>
        <div style={{marginTop:'10px',display:'flex',gap:'8px',flexWrap:'wrap'}}>
          {user.isAdmin && (
            <button
              onClick={() => setShowDiagnosticsPanel(true)}
              style={{padding:'8px 14px',background:'#334155',color:'white',border:'none',borderRadius:'5px',cursor:'pointer',display:'flex',alignItems:'center',gap:'7px'}}
            >
              <div className={bgHealth==='unknown'?'diag-pulse':''} style={{
                width:'9px',height:'9px',borderRadius:'50%',flexShrink:0,
                background: bgHealth==='healthy'?'#10b981': bgHealth==='error'?'#ef4444': bgHealth==='warning'?'#f59e0b':'#475569',
                boxShadow: bgHealth==='error'?'0 0 6px #ef4444': bgHealth==='warning'?'0 0 6px #f59e0b':'none'
              }}/>
              Diagnostics
            </button>
          )}
          <button onClick={handleLogout} style={{padding: '8px 16px', background: '#334155', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}>
            Logout
          </button>
        </div>
      </div>
      <div style={{padding: '20px'}}>
        <div style={{marginBottom: '20px', display: 'flex', gap: '10px', flexWrap: 'wrap', alignItems: 'center'}}>
          <input 
            type="text"
            placeholder="Search tools..."
            value={searchTerm}
            onChange={(e) => setSearchTerm(e.target.value)}
            style={{flex: '1', minWidth: '200px', padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
          />
          <select
            value={filterLocation}
            onChange={(e) => setFilterLocation(e.target.value)}
            style={{padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
          >
            <option value="all">All Locations</option>
            {locations.map(loc => (
              <option key={loc} value={loc}>{loc}</option>
            ))}
          </select>
          <select
            value={filterStatus}
            onChange={(e) => setFilterStatus(e.target.value)}
            style={{padding: '10px', background: '#334155', border: '1px solid #475569', borderRadius: '5px', color: 'white'}}
          >
            <option value="all">All Status</option>
            <option value="available">Available</option>
            <option value="checked-out">Checked Out</option>
            <option value="missing">Missing</option>
            <option value="damaged">Damaged</option>
          </select>
          {user.isAdmin && (
            <>
              <button onClick={() => setShowLocationsManageModal(true)} style={{padding: '10px 20px', background: '#6366f1', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}>
                📍 Locations
              </button>
              <button onClick={() => setShowAddModal(true)} style={{padding: '10px 20px', background: '#f97316', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}>
                Add Tool
              </button>
            </>
          )}
        </div>

        <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: '20px'}}>
          {filteredTools.map(tool => (
            <div key={tool.id} style={{background: '#1e293b', padding: '20px', borderRadius: '10px', border: '1px solid #334155', position: 'relative'}}>
              {user.isAdmin && (
                <div style={{position: 'absolute', top: '10px', right: '10px'}}>
                  <button onClick={() => setOpenMenuId(openMenuId === tool.id ? null : tool.id)} style={{background: '#334155', border: 'none', borderRadius: '5px', padding: '5px 10px', color: 'white', cursor: 'pointer'}}>
                    ⋮
                  </button>
                  {openMenuId === tool.id && (
                    <div style={{position: 'absolute', right: 0, marginTop: '5px', background: '#334155', borderRadius: '5px', border: '1px solid #475569', overflow: 'hidden', minWidth: '160px', zIndex: 10}}>
                      <button onClick={() => {
                        openQRModal(tool);
                        setOpenMenuId(null);
                      }} style={{width: '100%', padding: '10px', background: 'transparent', border: 'none', color: '#38bdf8', textAlign: 'left', cursor: 'pointer'}}>
                        📱 QR Code
                      </button>
                      <button onClick={() => {
                        setEditingTool(tool);
                        setShowEditModal(true);
                        setOpenMenuId(null);
                      }} style={{width: '100%', padding: '10px', background: 'transparent', border: 'none', color: 'white', textAlign: 'left', cursor: 'pointer'}}>
                        ✏️ Edit
                      </button>
                      {tool.status === 'missing' ? (
                        <button onClick={() => {
                          setSelectedTool(tool);
                          setShowFoundModal(true);
                          setOpenMenuId(null);
                        }} style={{width: '100%', padding: '10px', background: 'transparent', border: 'none', color: '#10b981', textAlign: 'left', cursor: 'pointer'}}>
                          ✓ Mark as Found
                        </button>
                      ) : tool.status === 'damaged' ? (
                        <button onClick={() => {
                          setSelectedTool(tool);
                          setShowRepairedModal(true);
                          setOpenMenuId(null);
                        }} style={{width: '100%', padding: '10px', background: 'transparent', border: 'none', color: '#10b981', textAlign: 'left', cursor: 'pointer'}}>
                          🔧 Mark as Repaired
                        </button>
                      ) : (
                        <>
                          <button onClick={() => {
                            setSelectedTool(tool);
                            setShowMissingModal(true);
                            setOpenMenuId(null);
                          }} style={{width: '100%', padding: '10px', background: 'transparent', border: 'none', color: '#f59e0b', textAlign: 'left', cursor: 'pointer'}}>
                            ⚠️ Mark as Missing
                          </button>
                          <button onClick={() => {
                            setSelectedTool(tool);
                            setShowDamagedModal(true);
                            setOpenMenuId(null);
                          }} style={{width: '100%', padding: '10px', background: 'transparent', border: 'none', color: '#ef4444', textAlign: 'left', cursor: 'pointer'}}>
                            🔧 Mark as Damaged
                          </button>
                        </>
                      )}
                      <button onClick={() => {
                        if (window.confirm('Delete this tool?')) {
                          deleteToolFromFirebase(tool.id);
                        }
                        setOpenMenuId(null);
                      }} style={{width: '100%', padding: '10px', background: 'transparent', border: 'none', color: '#ef4444', textAlign: 'left', cursor: 'pointer'}}>
                        🗑️ Delete
                      </button>
                    </div>
                  )}
                </div>
              )}
              {tool.image && (
                <div style={{width: '100%', height: '200px', marginBottom: '15px', borderRadius: '8px', overflow: 'hidden', background: '#0f172a'}}>
                  <img src={tool.image} alt={tool.name} style={{width: '100%', height: '100%', objectFit: 'cover'}} />
                </div>
              )}
              <h3 style={{color: 'white', fontSize: '18px', marginBottom: '10px', paddingRight: '40px'}}>{tool.name}</h3>
              <p style={{color: '#94a3b8', fontSize: '14px', marginBottom: '5px'}}>{tool.category}</p>
              {tool.location && (
                <p style={{color: '#cbd5e1', fontSize: '13px', marginBottom: '10px'}}>
                  📍 {tool.location}
                </p>
              )}
              <div style={{
                display: 'inline-block',
                padding: '5px 15px',
                background: tool.status === 'available' ? '#065f46' :
                           tool.status === 'checked-out' ? '#9a3412' :
                           tool.status === 'missing' ? '#7c2d12' :
                           tool.status === 'damaged' ? '#991b1b' : '#334155',
                color: tool.status === 'available' ? '#6ee7b7' :
                       tool.status === 'checked-out' ? '#fdba74' :
                       tool.status === 'missing' ? '#fef3c7' :
                       tool.status === 'damaged' ? '#fecaca' : '#cbd5e1',
                borderRadius: '20px',
                fontSize: '14px'
              }}>
                {tool.status === 'available' ? '✓ Available' :
                 tool.status === 'checked-out' ? '📤 Checked Out' :
                 tool.status === 'missing' ? '⚠️ Missing' :
                 tool.status === 'damaged' ? '🔧 Damaged' : tool.status}
              </div>
              {(tool.status === 'available' || tool.status === 'checked-out') && (
                <button onClick={() => {
                  if (tool.status === 'available') {
                    // Show confirmation modal for checkout
                    setCheckoutTool(tool);
                    setShowCheckoutModal(true);
                  } else {
                    // Check in directly without confirmation
                    const updatedTool = {...tool};
                    updatedTool.status = 'available';
                    updatedTool.holder = null;
                    updatedTool.history = [...(tool.history || []), {action: 'checked-in', user: user.name, time: new Date().toLocaleString()}];
                    updateToolInFirebase(tool.id, updatedTool);
                  }
                }} style={{width: '100%', marginTop: '15px', padding: '10px', background: tool.status === 'available' ? '#f97316' : '#16a34a', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer'}}>
                  {tool.status === 'available' ? 'Check Out' : 'Check In'}
                </button>
              )}
              {tool.holder && (
                <p style={{color: '#94a3b8', fontSize: '14px', marginTop: '10px'}}>
                  👤 Checked out by: {tool.holder}
                </p>
              )}
              {((tool.history && tool.history.length > 0) || (tool.statusLogs && tool.statusLogs.length > 0)) && (
                <details style={{marginTop: '10px'}}>
                  <summary style={{color: '#94a3b8', fontSize: '14px', cursor: 'pointer'}}>
                    📋 History ({(tool.history?.length || 0) + (tool.statusLogs?.length || 0)})
                  </summary>
                  <div style={{marginTop: '5px', maxHeight: '200px', overflowY: 'auto'}}>
                    {/* Status Logs */}
                    {tool.statusLogs && tool.statusLogs.slice(-20).reverse().map((log, i) => {
                      const actualIndex = tool.statusLogs.length - 1 - i;
                      return (
                      <div key={`status-${i}`} style={{padding: '8px', background: '#0f172a', borderRadius: '3px', marginBottom: '5px', fontSize: '12px', color: '#cbd5e1', border: '1px solid #1e293b', position: 'relative'}}>
                        {user.isAdmin && (
                          <div style={{position: 'absolute', top: '4px', right: '4px', display: 'flex', gap: '4px'}}>
                            <button
                              onClick={() => {
                                setEditingLog({tool, logType: 'status', logIndex: actualIndex, log});
                                setShowEditLogModal(true);
                              }}
                              style={{background: '#334155', border: 'none', borderRadius: '3px', padding: '2px 6px', color: '#94a3b8', cursor: 'pointer', fontSize: '10px'}}
                              title="Edit log"
                            >
                              ✏️
                            </button>
                            <button
                              onClick={() => {
                                const reason = prompt('Please provide a reason for deleting this log:');
                                if (reason && reason.trim()) {
                                  deleteLog(tool, 'status', actualIndex, reason);
                                }
                              }}
                              style={{background: '#334155', border: 'none', borderRadius: '3px', padding: '2px 6px', color: '#ef4444', cursor: 'pointer', fontSize: '10px'}}
                              title="Delete log"
                            >
                              🗑️
                            </button>
                          </div>
                        )}
                        <div style={{fontWeight: 'bold', marginBottom: '4px', paddingRight: user.isAdmin ? '50px' : '0'}}>
                          <span style={{
